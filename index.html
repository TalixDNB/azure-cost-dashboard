<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Cost Dashboard</title>

  <!-- Visible error overlay in case React never loads -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.getElementById("__err");
      var m = document.getElementById("__errmsg");
      if (d && m) { d.style.display="block"; m.textContent += (err ? err.stack : msg) + "\n\n"; }
    };
    window.addEventListener("unhandledrejection", function(e) {
      var d = document.getElementById("__err");
      var m = document.getElementById("__errmsg");
      var msg = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e);
      if (d && m) { d.style.display="block"; m.textContent += msg + "\n\n"; }
    });
  </script>

  <!-- Core: React + ReactDOM from cdnjs (very reliable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Babel for JSX transform -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <!-- Recharts deps: prop-types must come before recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js" crossorigin="anonymous"></script>

  <!-- Recharts from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js" crossorigin="anonymous"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }
    .spin { animation: _spin 1s linear infinite; }
    @keyframes _spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="__err" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;padding:20px;overflow:auto;font-family:monospace;">
  <h2 style="color:#ef4444;margin:0 0 8px">JavaScript Error</h2>
  <p style="font-size:13px;color:#64748b;margin:0 0 12px">Something went wrong loading the app. Error details:</p>
  <pre id="__errmsg" style="background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;color:#991b1b;"></pre>
  <button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:#3b82f6;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;">Reload</button>
</div>
<div id="root"></div>

  <script>
    // Safety check — if any critical library failed to load, show a message
    window.addEventListener("load", function() {
      if (!window.React || !window.ReactDOM || !window.Recharts) {
        document.getElementById("root").innerHTML =
          '<div style="padding:40px;text-align:center;color:#ef4444;font-family:sans-serif">' +
          '<h2>Failed to load dependencies</h2>' +
          '<p>Please check your internet connection and reload the page.</p>' +
          '<p style="font-size:12px;color:#94a3b8">Missing: ' +
          (!window.React ? "React " : "") +
          (!window.ReactDOM ? "ReactDOM " : "") +
          (!window.Recharts ? "Recharts" : "") + '</p></div>';
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Pull Recharts components safely
    const {
      LineChart, Line,
      AreaChart, Area,
      BarChart, Bar,
      XAxis, YAxis,
      CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, Cell
    } = Recharts;

    // =========================================================================
    // CONFIG
    // =========================================================================
    const CLIENT_ID    = "dcdf39df-efdf-4f55-96fb-c24f4f9111ac";
    const TENANT       = "460bc2b5-594c-44eb-8930-8d13538d7f0e";
    const SCOPES       = "https://management.azure.com/user_impersonation offline_access openid profile";
    const AUTH_EP      = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/authorize`;
    const TOKEN_EP     = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token`;
    const ARM_BASE     = "https://management.azure.com";
    const REDIRECT_URI = "https://talixdnb.github.io/azure-cost-dashboard/";
    const CACHE_TTL_MS = 6 * 60 * 60 * 1000;

    // =========================================================================
    // TEST DATA — rich synthetic dataset covering all dimensions
    // =========================================================================
    function generateTestData(days) {
      const RESOURCES = [
        { name: "asp-prod-plan",       service: "Microsoft.Web",               rg: "rg-prod",    location: "australiaeast",  baseCost: 5.0  },
        { name: "app-api-prod",        service: "Microsoft.Web",               rg: "rg-prod",    location: "australiaeast",  baseCost: 1.2  },
        { name: "stg-prod-assets",     service: "Microsoft.Storage",           rg: "rg-prod",    location: "australiaeast",  baseCost: 0.4  },
        { name: "stg-staging-data",    service: "Microsoft.Storage",           rg: "rg-staging", location: "australiasouth", baseCost: 0.1  },
        { name: "sql-prod-db",         service: "Microsoft.Sql",               rg: "rg-prod",    location: "australiaeast",  baseCost: 2.8  },
        { name: "vm-dev-build",        service: "Microsoft.Compute",           rg: "rg-dev",     location: "southeastasia",  baseCost: 0.9  },
        { name: "cog-search-prod",     service: "Microsoft.CognitiveServices", rg: "rg-shared",  location: "australiaeast",  baseCost: 0.3  },
        { name: "vnet-prod",           service: "Microsoft.Network",           rg: "rg-shared",  location: "australiaeast",  baseCost: 0.05 },
      ];
      const seed = (x) => Math.abs(Math.sin(x * 127.1 + 311.7));
      const today = new Date();
      const records = [];
      for (let d = days - 1; d >= 0; d--) {
        const dt = new Date(today);
        dt.setUTCDate(dt.getUTCDate() - d);
        const iso = dt.toISOString().slice(0, 10);
        const dayIndex = days - 1 - d;
        const progress = dayIndex / days;
        for (const res of RESOURCES) {
          const trend    = res.rg === "rg-prod" ? 1 + progress * 0.4 : res.rg === "rg-dev" ? 1 - progress * 0.2 : 1;
          const dow      = dt.getUTCDay();
          const seasonal = (dow === 0 || dow === 6) ? 0.7 : 1.0;
          const spike    = (res.name === "asp-prod-plan" && dayIndex > days * 0.55 && dayIndex < days * 0.85) ? 2.2 : 1.0;
          const noise    = 0.85 + seed(dayIndex * 13 + RESOURCES.indexOf(res)) * 0.3;
          records.push({
            date: iso, cost: parseFloat((res.baseCost * trend * seasonal * spike * noise).toFixed(4)),
            currency: "AUD", service: res.service, resourceGroup: res.rg,
            resourceName: res.name, location: res.location, subName: "Test Subscription"
          });
        }
      }
      const from = new Date(today); from.setUTCDate(from.getUTCDate() - days);
      return {
        currency: "AUD", fetchedAt: Date.now(), isTest: true, fromCache: false, days,
        from: from.toISOString().slice(0, 10), to: today.toISOString().slice(0, 10), records
      };
    }


    // =========================================================================
    // PKCE
    // =========================================================================
    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    const randBytes = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; };
    const makePkce = async () => {
      const verifier  = b64url(randBytes(64).buffer);
      const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      return { verifier, challenge };
    };

    // =========================================================================
    // Storage (localStorage + in-memory fallback)
    // =========================================================================
    const _mem = {};
    const kv = {
      get(k)    { try { return localStorage.getItem(k); } catch { return _mem[k] ?? null; } },
      set(k, v) { const s = typeof v === "string" ? v : JSON.stringify(v);
                  try { localStorage.setItem(k, s); } catch { _mem[k] = s; } },
      del(k)    { try { localStorage.removeItem(k); } catch { delete _mem[k]; } }
    };

    // =========================================================================
    // Auth
    // =========================================================================
    function buildAuthUrl(challenge, state) {
      return `${AUTH_EP}?${new URLSearchParams({
        client_id: CLIENT_ID, response_type: "code",
        redirect_uri: REDIRECT_URI, scope: SCOPES,
        response_mode: "query", code_challenge: challenge,
        code_challenge_method: "S256", state, prompt: "select_account"
      })}`;
    }

    async function exchangeCode(code, verifier) {
      const res = await fetch(TOKEN_EP, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code", client_id: CLIENT_ID,
          code, redirect_uri: REDIRECT_URI, code_verifier: verifier
        })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error_description || json.error || `Token exchange failed (${res.status})`);
      return json;
    }

    async function doRefresh(rt) {
      const res = await fetch(TOKEN_EP, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "refresh_token", client_id: CLIENT_ID,
          refresh_token: rt, scope: SCOPES
        })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error_description || json.error || "Refresh failed");
      return json;
    }

    function makeToken(resp, fallbackRt) {
      return {
        access_token:  resp.access_token,
        refresh_token: resp.refresh_token || fallbackRt,
        expires_at:    Date.now() + (resp.expires_in - 60) * 1000
      };
    }

    async function ensureValidToken() {
      const raw = kv.get("auth:token");
      if (!raw) throw new Error("Not signed in");
      const t = JSON.parse(raw);
      if (t.expires_at > Date.now() + 60_000) return t.access_token;
      if (!t.refresh_token) throw new Error("Session expired, please sign in again");
      const fresh = await doRefresh(t.refresh_token);
      const nt = makeToken(fresh, t.refresh_token);
      kv.set("auth:token", nt);
      return nt.access_token;
    }

    // =========================================================================
    // ARM API
    // =========================================================================
    async function armGet(url, at) {
      const fullUrl = url.startsWith("http") ? url : `${ARM_BASE}${url}`;
      const res = await fetch(fullUrl, { headers: { Authorization: `Bearer ${at}` } });
      if (res.status === 401) throw new Error("Session expired — please sign in again.");
      if (res.status === 403) throw new Error("Access denied. Make sure your account has Cost Management Reader on this subscription.");
      if (res.status === 429) {
        const wait = parseInt(res.headers.get("retry-after") || "15", 10);
        await new Promise(r => setTimeout(r, wait * 1000));
        return armGet(url, at);
      }
      if (!res.ok) {
        let msg = `API error ${res.status}`;
        try { const j = await res.json(); msg = j.error?.message || j.message || msg; } catch {}
        throw new Error(msg);
      }
      return res.json();
    }

    async function listSubs(at) {
      const j = await armGet("/subscriptions?api-version=2022-12-01", at);
      return (j.value || [])
        .map(s => ({ id: s.subscriptionId, name: s.displayName, state: s.state }))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    async function fetchUsageDetails(subId, from, to, at, onProgress) {
      const filter = `properties/usageStart ge '${from}' and properties/usageEnd le '${to}'`;
      let url = `/subscriptions/${subId}/providers/Microsoft.Consumption/usageDetails`
              + `?api-version=2019-10-01`
              + `&$filter=${encodeURIComponent(filter)}`
              + `&$top=1000`
              + `&metric=actualcost`;
      const all = [];
      let pages = 0;
      while (url && pages < 200) {
        const j = await armGet(url, at);
        if (Array.isArray(j.value)) all.push(...j.value);
        url = j.nextLink || null;
        pages++;
        if (onProgress) onProgress(all.length);
      }
      return all;
    }

    // Normalize service names — the API mixes casing (e.g. "microsoft.web" and "Microsoft.Storage")
    function normaliseService(s) {
      if (!s) return "Unknown";
      // Capitalize each segment split by dot; e.g. "microsoft.web" → "Microsoft.Web"
      return s.split(".").map(seg => {
        if (!seg) return seg;
        // Preserve all-caps segments (rare but possible)
        if (seg === seg.toUpperCase() && seg.length > 1) return seg;
        return seg.charAt(0).toUpperCase() + seg.slice(1).toLowerCase();
      }).join(".");
    }

    function normaliseRecord(r, subName) {
      const p = r.properties || {};
      const cost     = parseFloat(p.cost ?? p.costInBillingCurrency ?? p.pretaxCost ?? 0) || 0;
      const currency = p.billingCurrency ?? p.billingCurrencyCode ?? "USD";
      const date     = (p.date ?? p.usageStart ?? "").slice(0, 10);
      const service  = normaliseService(p.consumedService ?? p.meterCategory ?? "Unknown");
      const rg       = (p.resourceGroup ?? p.resourceGroupName ?? "—").toLowerCase() || "—";
      const resId    = p.instanceName ?? p.resourceId ?? p.instanceId ?? "";
      const resName  = resId ? resId.split("/").pop() || resId : (p.productOrderName || "—");
      const location = p.resourceLocation ?? p.location ?? "—";
      return {
        date, cost, currency, service,
        resourceGroup: rg,
        resourceName: resName || "—",
        location,
        subName
      };
    }

    // =========================================================================
    // Cost data fetch + cache
    // =========================================================================
    function cacheKey(subIds, days) {
      // v2: bumped after service-name normalization was added
      return `cost:v2:${[...subIds].sort().join(",")}:${days}`;
    }

    async function getCostData(selected, allSubs, days, onProgress, force) {
      const key = cacheKey([...selected], days);
      if (!force) {
        try {
          const raw = kv.get(key);
          if (raw) {
            const c = JSON.parse(raw);
            if (Date.now() - c.fetchedAt < CACHE_TTL_MS) return { ...c, fromCache: true };
          }
        } catch {}
      }

      const today = new Date();
      const from  = new Date(today); from.setDate(from.getDate() - days);
      const fromStr = from.toISOString().slice(0, 10);
      const toStr   = today.toISOString().slice(0, 10);

      const at = await ensureValidToken();
      const records = [];
      const subList = allSubs.filter(s => selected.has(s.id));

      for (let i = 0; i < subList.length; i++) {
        const sub = subList[i];
        if (onProgress) onProgress(`Fetching ${sub.name} (${i+1}/${subList.length})…`);
        const raw = await fetchUsageDetails(sub.id, fromStr, toStr, at,
          count => onProgress && onProgress(`${sub.name}: ${count.toLocaleString()} records…`));
        for (const r of raw) records.push(normaliseRecord(r, sub.name));
      }

      const currency = records.find(r => r.currency)?.currency || "USD";
      const data = { currency, fetchedAt: Date.now(), from: fromStr, to: toStr, days, records };
      try { kv.set(key, JSON.stringify(data)); } catch (e) { console.warn("Cache write failed", e); }
      return { ...data, fromCache: false };
    }

    // =========================================================================
    // Data helpers
    // =========================================================================
    function fmt(n, currency) {
      if (!n && n !== 0) return "—";
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency", currency,
          minimumFractionDigits: 2, maximumFractionDigits: 2
        }).format(n);
      } catch { return `${currency} ${n.toFixed(2)}`; }
    }

    function fmtCompact(n, currency) {
      if (!n && n !== 0) return "—";
      try {
        if (Math.abs(n) >= 1000) {
          return new Intl.NumberFormat(undefined, {
            style: "currency", currency, notation: "compact", maximumFractionDigits: 1
          }).format(n);
        }
        return fmt(n, currency);
      } catch { return fmt(n, currency); }
    }

    function groupSum(records, keyFn) {
      const map = {};
      for (const r of records) {
        const k = keyFn(r) || "—";
        map[k] = (map[k] || 0) + r.cost;
      }
      return Object.entries(map)
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);
    }

    // Bucket a date string ("YYYY-MM-DD") into a label and sortable key
    // for the chosen bucket size. Returns { key, label }.
    function bucketDate(iso, bucket) {
      const d = new Date(iso);
      if (bucket === "month") {
        const y = d.getUTCFullYear();
        const m = d.getUTCMonth(); // 0-11
        const key = `${y}-${String(m + 1).padStart(2, "0")}`;
        const label = d.toLocaleString(undefined, { month: "short", year: "2-digit", timeZone: "UTC" });
        return { key, label };
      }
      if (bucket === "week") {
        // ISO week starts Monday; we use a simple week-of-year by snapping to Monday.
        const dt = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
        const day = dt.getUTCDay() || 7; // 1..7 (Mon..Sun)
        dt.setUTCDate(dt.getUTCDate() - (day - 1));
        const key = dt.toISOString().slice(0, 10);
        const label = `${dt.toLocaleString(undefined, { month: "short", day: "numeric", timeZone: "UTC" })}`;
        return { key, label };
      }
      // daily
      return { key: iso, label: iso.slice(5) };
    }

    // Determine the widest sensible default bucket given a date range in days.
    function defaultBucket(days) {
      if (days >= 90) return "month";
      if (days >= 30) return "week";
      return "day";
    }

    // Iterate every day from `from` to `to` inclusive.
    function* iterDays(from, to) {
      const cur = new Date(from), end = new Date(to);
      while (cur <= end) {
        yield cur.toISOString().slice(0, 10);
        cur.setUTCDate(cur.getUTCDate() + 1);
      }
    }

    // Build a flat (single-series) time series for the chosen bucket, no grouping.
    function buildTimeSeries(records, from, to, bucket) {
      // Sum costs by bucket key
      const sums = {};
      const labelByKey = {};
      for (const r of records) {
        if (!r.date) continue;
        const { key, label } = bucketDate(r.date, bucket);
        sums[key] = (sums[key] || 0) + r.cost;
        labelByKey[key] = label;
      }
      // Fill all buckets in range so the chart has continuous x-axis
      const keysSeen = new Set();
      const out = [];
      for (const iso of iterDays(from, to)) {
        const { key, label } = bucketDate(iso, bucket);
        if (keysSeen.has(key)) continue;
        keysSeen.add(key);
        out.push({ key, label, total: sums[key] || 0 });
      }
      out.sort((a, b) => a.key.localeCompare(b.key));
      return out;
    }

    // Build a multi-series (grouped) time series: one column per top-N groups + "Other".
    // Returns { rows: [{ key, label, [groupName]: cost, ... }], groupNames: [...] }.
    function buildGroupedTimeSeries(records, from, to, bucket, keyFn, topN = 6) {
      // First, compute total cost per group across the whole range to find top N.
      const groupTotals = {};
      for (const r of records) {
        const g = keyFn(r) || "—";
        groupTotals[g] = (groupTotals[g] || 0) + r.cost;
      }
      const sortedGroups = Object.entries(groupTotals)
        .sort((a, b) => b[1] - a[1])
        .map(([g]) => g);
      const topGroups = sortedGroups.slice(0, topN);
      const otherGroups = new Set(sortedGroups.slice(topN));
      const includeOther = otherGroups.size > 0;
      const groupNames = includeOther ? [...topGroups, "Other"] : [...topGroups];

      // Build sums[bucketKey][groupName] = cost
      const sums = {};
      for (const r of records) {
        if (!r.date) continue;
        const { key } = bucketDate(r.date, bucket);
        const g = keyFn(r) || "—";
        const groupName = otherGroups.has(g) ? "Other" : g;
        if (!sums[key]) sums[key] = {};
        sums[key][groupName] = (sums[key][groupName] || 0) + r.cost;
      }

      // Walk every bucket in the date range to fill gaps
      const seen = new Set();
      const rows = [];
      for (const iso of iterDays(from, to)) {
        const { key, label } = bucketDate(iso, bucket);
        if (seen.has(key)) continue;
        seen.add(key);
        const row = { key, label };
        for (const g of groupNames) row[g] = (sums[key] && sums[key][g]) || 0;
        rows.push(row);
      }
      rows.sort((a, b) => a.key.localeCompare(b.key));
      return { rows, groupNames };
    }

    function calcStats(records, days) {
      const total = records.reduce((s, r) => s + r.cost, 0);
      const byDate = {};
      for (const r of records) byDate[r.date] = (byDate[r.date] || 0) + r.cost;
      let peakDay = { date: "—", cost: 0 };
      for (const [d, c] of Object.entries(byDate)) {
        if (c > peakDay.cost) peakDay = { date: d, cost: c };
      }
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - Math.floor(days / 2));
      const cutoffIso = cutoff.toISOString().slice(0, 10);
      const recent  = records.filter(r => r.date >= cutoffIso).reduce((s, r) => s + r.cost, 0);
      const earlier = records.filter(r => r.date <  cutoffIso).reduce((s, r) => s + r.cost, 0);
      const trendPct = earlier > 0.01 ? ((recent - earlier) / earlier) * 100 : null;
      return { total, avgDaily: total / days, peakDay, trendPct, recent, earlier };
    }

    function calcMovers(records, days, keyFn) {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - Math.floor(days / 2));
      const cutoffIso = cutoff.toISOString().slice(0, 10);
      const first = {}, second = {};
      for (const r of records) {
        const k = keyFn(r) || "—";
        if (r.date >= cutoffIso) second[k] = (second[k] || 0) + r.cost;
        else first[k] = (first[k] || 0) + r.cost;
      }
      const keys = new Set([...Object.keys(first), ...Object.keys(second)]);
      const movers = [];
      for (const k of keys) {
        const before = first[k]  || 0;
        const after  = second[k] || 0;
        const delta  = after - before;
        if (Math.abs(delta) < 0.50) continue;
        movers.push({ name: k, before, after, delta });
      }
      return {
        increasing: movers.filter(m => m.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 5),
        decreasing: movers.filter(m => m.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 5)
      };
    }

    // =========================================================================
    // UI helpers
    // =========================================================================
    const cx = (...a) => a.filter(Boolean).join(" ");
    const PALETTE = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#6366f1"];

    function Spinner({ size = 20, className = "" }) {
      return (
        <div className={cx("spin inline-block", className)} style={{ width: size, height: size }}>
          <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5">
            <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83" strokeLinecap="round"/>
          </svg>
        </div>
      );
    }

    function Card({ children, className = "" }) {

        ghost:     "text-slate-500 hover:text-slate-800 hover:bg-slate-100"

      return (
        <button onClick={onClick} disabled={disabled}
          className={cx(
            "inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition-colors select-none",
            "disabled:opacity-40 disabled:cursor-not-allowed",
            small ? "text-xs px-2.5 py-1.5" : "text-sm px-4 py-2.5",
            variants[variant],
            full && "w-full"

          {children}

                <svg width="30" height="30" fill="none" stroke="white" strokeWidth="2" viewBox="0 0 24 24">

    // =========================================================================

    function SubPicker({ subs, selected, onToggle, onSelectAll, onContinue, onSignOut, loading }) {

            <Card>
              <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">
                  {loading ? "Loading…" : `${subs.length} subscription${subs.length !== 1 ? "s" : ""} found`}

                {subs.length > 1 && (

                      <div className="flex-1 min-w-0">

    // =========================================================================
    // Dashboard: KPI Card
    // =========================================================================
    function KpiCard({ label, value, sub, trend }) {
      const dark = useDark();
      const color = trend == null ? "" : trend > 0 ? (dark ? "text-rose-400" : "text-rose-600") : (dark ? "text-emerald-400" : "text-emerald-600");
      return (
        <div className={cx("rounded-xl border shadow-sm p-2.5", dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
          <div className={cx("text-xs font-medium leading-tight", dark ? "text-gray-400" : "text-slate-400")}>{label}</div>
          <div className={cx("mt-0.5 font-bold leading-tight", dark ? "text-gray-100" : "text-slate-900",
            value && value.length > 8 ? "text-sm" : "text-base")}>{value}</div>
          {trend != null && (
            <div className={cx("text-xs font-semibold mt-0.5 leading-tight", color)}>
              {trend > 0 ? "▲" : "▼"}{Math.abs(trend).toFixed(0)}%
            </div>
          )}

      );

    // =========================================================================
    // Dashboard: Charts
    // =========================================================================
    const GROUP_OPTS = [
      { id: "service",       label: "Service",        plural: "services",        fn: r => r.service },
      { id: "resourceGroup", label: "Resource group",  plural: "resource groups", fn: r => r.resourceGroup },
      { id: "resourceName",  label: "Resource",        plural: "resources",       fn: r => r.resourceName },
      { id: "location",      label: "Location",        plural: "locations",       fn: r => r.location },
    ];

    // Dark mode context
    const DarkCtx = React.createContext(false);
    const useDark = () => React.useContext(DarkCtx);

    // Collapsible section wrapper
    function Section({ title, right, storageKey, children }) {
      const dark = useDark();
      const [open, setOpen] = useState(() => {
        try { const v = localStorage.getItem("section:" + storageKey); return v === null ? true : v === "1"; }
        catch { return true; }
      });
      const toggle = () => {
        const next = !open;
        setOpen(next);
        try { localStorage.setItem("section:" + storageKey, next ? "1" : "0"); } catch {}
      };
      return (
        <div className={cx("rounded-xl border shadow-sm overflow-hidden", dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
          <button onClick={toggle} className={cx(
            "w-full flex items-center justify-between px-4 py-3 text-left transition-colors",
            dark ? "hover:bg-gray-700" : "hover:bg-slate-50"
          )}>
            <div className="flex items-center gap-2">
              <span className={cx("text-sm font-semibold", dark ? "text-gray-100" : "text-slate-700")}>{title}</span>
              {right && <span className={cx("text-xs", dark ? "text-gray-400" : "text-slate-400")}>{right}</span>}
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
              strokeLinecap="round" className={cx("transition-transform flex-shrink-0", dark ? "text-gray-400" : "text-slate-400", open ? "" : "-rotate-90")}>
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
          {open && <div className={cx("border-t", dark ? "border-gray-700" : "border-slate-100")}>{children}</div>}
        </div>
      );
    }

    function TimeSeriesChart({ records, currency, from, to, days, groupOpt, bucket, setBucket, style, setStyle, showTotal, setShowTotal }) {
      // Decide what data to render
      const useGrouping = groupOpt && groupOpt.id !== "total";
      const series = useMemo(() => {
        if (!useGrouping) {
          const flat = buildTimeSeries(records, from, to, bucket);
          return { rows: flat.map(r => ({ ...r })), groupNames: ["total"] };
        }
        return buildGroupedTimeSeries(records, from, to, bucket, groupOpt.fn, 6);
      }, [records, from, to, bucket, useGrouping, groupOpt && groupOpt.id]);

      const BUCKET_OPTS = [
        { id: "day",   label: "Daily" },
        { id: "week",  label: "Weekly" },
        { id: "month", label: "Monthly" },
      ];

      const isStacked = style === "stacked";
      const isGrouped = useGrouping;

      // Empty state
      if (!series.rows.length) {
        return (
          <Card className="p-4">
            <div className="text-sm font-semibold text-slate-700 mb-3">Cost over time</div>
            <div className="text-sm text-slate-400 text-center py-8">No data in selected range.</div>
          </Card>
        );
      }

      // Tooltip: order entries by value desc and add a Total row when grouped
      const customTooltip = ({ active, payload, label }) => {
        if (!active || !payload || !payload.length) return null;
        const sorted = [...payload].filter(p => p.value > 0).sort((a, b) => b.value - a.value);
        const total = sorted.reduce((s, p) => s + p.value, 0);
        return (
          <div className="bg-white border border-slate-200 rounded-lg shadow-md p-2.5 text-xs max-w-[260px]">
            <div className="font-semibold text-slate-700 mb-1">{label}</div>
            {isGrouped && (
              <div className="flex justify-between gap-3 pb-1 mb-1 border-b border-slate-100">
                <span className="text-slate-500">Total</span>
                <span className="font-semibold text-slate-900 tabular-nums">{fmt(total, currency)}</span>
              </div>
            )}
            {sorted.map((p, i) => (
              <div key={i} className="flex justify-between gap-3 py-0.5">
                <span className="flex items-center gap-1.5 truncate">
                  <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: p.color }} />
                  <span className="truncate text-slate-600">{p.dataKey === "total" ? "Cost" : p.dataKey}</span>
                </span>
                <span className="tabular-nums text-slate-900 font-medium flex-shrink-0">{fmt(p.value, currency)}</span>
              </div>
            ))}
          </div>
        );
      };

      const dark = useDark();
      const gridColor = dark ? "#374151" : "#f1f5f9";
      const tickColor = dark ? "#9ca3af" : "#94a3b8";
      const tooltipStyle = dark ? { background: "#1f2937", border: "1px solid #374151", borderRadius: 8, fontSize: 12 }
                                : { borderRadius: 8, fontSize: 12 };
      const tsTitle = isGrouped ? `Cost by ${groupOpt.label.toLowerCase()}` : "Daily cost";
      const tsBucketLabel = BUCKET_OPTS.find(b => b.id === bucket).label.toLowerCase();

      return (
        <Section title={tsTitle} right={`(${tsBucketLabel})`} storageKey="time-series">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
          {/* Controls row: bucket + style toggle */}
          <div className="flex flex-wrap items-center gap-2 mb-3">
            <div className="flex gap-1 bg-slate-100 rounded-md p-0.5">
              {BUCKET_OPTS.map(b => (
                <button key={b.id} onClick={() => setBucket(b.id)}
                  className={cx("text-xs px-2.5 py-1 rounded font-medium transition-colors",
                    bucket === b.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700")}>
                  {b.label}
                </button>
              ))}
            </div>
            {isGrouped && (
              <div className="flex gap-1 bg-slate-100 rounded-md p-0.5">
                <button onClick={() => setStyle("stacked")}
                  className={cx("text-xs px-2.5 py-1 rounded font-medium transition-colors",
                    style === "stacked" ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700")}>
                  Stacked
                </button>
                <button onClick={() => setStyle("lines")}
                  className={cx("text-xs px-2.5 py-1 rounded font-medium transition-colors",
                    style === "lines" ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-700")}>
                  Lines
                </button>
              </div>
            )}
          </div>

          <div style={{ height: 260 }}>
            <ResponsiveContainer width="100%" height="100%">
              {(isGrouped && isStacked) ? (
                <AreaChart data={series.rows} margin={{ top: 5, right: 5, bottom: 0, left: -10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={gridColor} />
                  <XAxis dataKey="label" tick={{ fontSize: 10, fill: tickColor }} interval="preserveStartEnd" />
                  <YAxis tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} width={55} />
                  <Tooltip content={customTooltip} />
                  {series.groupNames.map((g, i) => (
                    <Area key={g} type="monotone" dataKey={g} stackId="1"
                      stroke={PALETTE[i % PALETTE.length]} fill={PALETTE[i % PALETTE.length]} fillOpacity={0.5} strokeWidth={1.5} />
                  ))}
                </AreaChart>
              ) : (
                <LineChart data={series.rows} margin={{ top: 5, right: 5, bottom: 0, left: -10 }}>
                  <CartesianGrid strokeDasharray="3 3" stroke={gridColor} />
                  <XAxis dataKey="label" tick={{ fontSize: 10, fill: tickColor }} interval="preserveStartEnd" />
                  <YAxis tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} width={55} />
                  <Tooltip content={customTooltip} />
                  {series.groupNames.map((g, i) => (
                    <Line key={g} type="monotone" dataKey={g}
                      stroke={isGrouped ? PALETTE[i % PALETTE.length] : "#3b82f6"}
                      strokeWidth={2} dot={false} activeDot={{ r: 4 }} />
                  ))}
                </LineChart>
              )}
            </ResponsiveContainer>
          </div>

          {/* Custom legend below the chart, only when grouped */}
          {isGrouped && (
            <div className={cx("flex flex-wrap gap-x-3 gap-y-1.5 mt-3 pt-3 border-t", dark ? "border-gray-700" : "border-slate-100")}>
              {series.groupNames.map((g, i) => (
                <div key={g} className={cx("flex items-center gap-1.5 text-xs max-w-full", dark ? "text-gray-400" : "text-slate-600")}>
                  <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0" style={{ background: PALETTE[i % PALETTE.length] }} />
                  <span className="truncate" title={g}>{g}</span>
                </div>
              ))}
            </div>
          )}
          </div>
        </Section>
      );
    }

    function GroupChart({ records, currency, groupOpt }) {
      const dark = useDark();
      const data = useMemo(() => groupSum(records, groupOpt.fn).slice(0, 8), [records, groupOpt.id]);
      const gridColor = dark ? "#374151" : "#f1f5f9";
      const tickColor = dark ? "#9ca3af" : "#94a3b8";
      const labelColor = dark ? "#d1d5db" : "#334155";
      const tooltipStyle = dark ? { background: "#1f2937", border: "1px solid #374151", borderRadius: 8, fontSize: 12 }
                                : { borderRadius: 8, fontSize: 12 };
      return (
        <Section title={`Top by ${groupOpt.label.toLowerCase()}`} right="Top 8" storageKey="group-chart">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
            <div style={{ height: 260 }}>
              {data.length === 0
                ? <div className={cx("h-full flex items-center justify-center text-sm", dark ? "text-gray-500" : "text-slate-400")}>No data</div>
                : (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={data} layout="vertical" margin={{ top: 0, right: 10, bottom: 0, left: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke={gridColor} horizontal={false} />
                      <XAxis type="number" tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} />
                      <YAxis type="category" dataKey="name" tick={{ fontSize: 10, fill: labelColor }} width={110} />
                      <Tooltip formatter={v => [fmt(v, currency), "Cost"]} contentStyle={tooltipStyle} />
                      <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                        {data.map((_, i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                )
              }
            </div>
          </div>
        </Section>
      );
    }

    function MoversCard({ records, days, currency, groupOpt }) {
      const dark = useDark();
      const { increasing, decreasing } = useMemo(
        () => calcMovers(records, days, groupOpt.fn),
        [records, days, groupOpt.id]
      );
      const riseColor = dark ? "text-rose-400" : "text-rose-600";
      const fallColor = dark ? "text-emerald-400" : "text-emerald-600";
      const muted = dark ? "text-gray-500" : "text-slate-400";
      const txt = dark ? "text-gray-200" : "text-slate-700";
      return (
        <Section title="Top movers" right={`by ${groupOpt.label.toLowerCase()}`} storageKey="movers">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
            <p className={cx("text-xs mb-3", muted)}>Second half vs first half of the period</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <div className={cx("text-xs font-semibold mb-2", riseColor)}>▲ Increased</div>
                {increasing.length === 0
                  ? <p className={cx("text-xs", muted)}>None above threshold</p>
                  : increasing.map(m => (
                    <div key={m.name} className="flex items-center justify-between py-1 text-sm gap-2">
                      <span className={cx("truncate", txt)} title={m.name}>{m.name}</span>
                      <span className={cx("flex-shrink-0 font-semibold tabular-nums", riseColor)}>+{fmt(m.delta, currency)}</span>
                    </div>
                  ))
                }
              </div>
              <div>
                <div className={cx("text-xs font-semibold mb-2", fallColor)}>▼ Decreased</div>
                {decreasing.length === 0
                  ? <p className={cx("text-xs", muted)}>None above threshold</p>
                  : decreasing.map(m => (
                    <div key={m.name} className="flex items-center justify-between py-1 text-sm gap-2">
                      <span className={cx("truncate", txt)} title={m.name}>{m.name}</span>
                      <span className={cx("flex-shrink-0 font-semibold tabular-nums", fallColor)}>{fmt(m.delta, currency)}</span>
                    </div>
                  ))
                }
              </div>
            </div>
          </div>
        </Section>
      );
    }

    function DetailTable({ records, currency, total, groupOpt }) {
      const dark = useDark();
      const [q, setQ] = useState("");
      const rows = useMemo(() => {
        const map = {};
        for (const r of records) {
          const k = groupOpt.fn(r) || "—";
          if (!map[k]) map[k] = { name: k, cost: 0 };
          map[k].cost += r.cost;
        }
        let arr = Object.values(map).sort((a, b) => b.cost - a.cost);
        if (q) {
          const lq = q.toLowerCase();
          arr = arr.filter(r => r.name.toLowerCase().includes(lq));
        }
        return arr;
      }, [records, q, groupOpt.id]);

      const th = cx("px-4 py-2 text-left font-medium uppercase tracking-wide text-xs",
        dark ? "text-gray-400" : "text-slate-500");
      const thR = cx("px-4 py-2 text-right font-medium uppercase tracking-wide text-xs",
        dark ? "text-gray-400" : "text-slate-500");

      return (
        <Section title={`All ${groupOpt.plural}`} storageKey="detail-table">
          <div className={cx("px-4 py-2.5 flex items-center gap-2", dark ? "bg-gray-800" : "bg-white")}>
            <input type="text" placeholder={`Search ${groupOpt.plural}…`} value={q}
              onChange={e => setQ(e.target.value)}
              className={cx("text-sm rounded-md px-3 py-1.5 w-full focus:outline-none border",
                dark ? "bg-gray-700 border-gray-600 text-gray-100 placeholder-gray-500 focus:border-blue-500"
                     : "border-slate-200 focus:border-blue-400")} />
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className={cx(dark ? "bg-gray-900" : "bg-slate-50")}>
                <tr>
                  <th className={th}>{groupOpt.label}</th>
                  <th className={thR}>Cost</th>
                  <th className={cx(thR, "hidden sm:table-cell")}>% of total</th>
                </tr>
              </thead>
              <tbody className={cx("divide-y", dark ? "divide-gray-700" : "divide-slate-100")}>
                {rows.length === 0 && (
                  <tr><td colSpan={3} className={cx("px-4 py-8 text-center text-sm", dark ? "text-gray-500" : "text-slate-400")}>No results</td></tr>
                )}
                {rows.slice(0, 100).map((r, i) => (
                  <tr key={i} className={cx("transition-colors", dark ? "hover:bg-gray-700" : "hover:bg-slate-50")}>
                    <td className={cx("px-4 py-2.5 font-medium max-w-[200px] truncate", dark ? "text-gray-200" : "text-slate-900")} title={r.name}>{r.name}</td>
                    <td className={cx("px-4 py-2.5 text-right tabular-nums", dark ? "text-gray-200" : "text-slate-900")}>{fmt(r.cost, currency)}</td>
                    <td className={cx("px-4 py-2.5 text-right tabular-nums hidden sm:table-cell", dark ? "text-gray-500" : "text-slate-400")}>
                      {total > 0 ? ((r.cost / total) * 100).toFixed(1) + "%" : "—"}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            {rows.length > 100 && (
              <p className={cx("px-4 py-2.5 text-center text-xs", dark ? "text-gray-500 bg-gray-900" : "text-slate-400 bg-slate-50")}>
                Showing top 100 of {rows.length}
              </p>
            )}
          </div>
        </Section>
      );
    }

    // =========================================================================
    // Main Dashboard
    // =========================================================================
    function Dashboard({ selected, allSubs, onChangeSubs, onSignOut }) {
      const [days, setDays]     = useState(30);
      const [data, setData]     = useState(null);
      const [loading, setLoading] = useState(true);
      const [progress, setProgress] = useState("");
      const [error, setError]   = useState(null);
      const [testMode, setTestMode] = useState(false);
      const [dark, setDark] = useState(() => {
        try { return localStorage.getItem("dark") === "1"; } catch { return false; }
      });

      // Shared grouping — controls time-series, bar chart AND movers
      const [groupId, setGroupId] = useState("service");

      // Time series controls
      const [bucket, setBucket] = useState(() => defaultBucket(30));
      const [style, setStyle]   = useState("stacked");

      // When days changes reset to widest sensible bucket
      useEffect(() => { setBucket(defaultBucket(days)); }, [days]);

      const load = useCallback(async (force = false) => {
        if (testMode) {
          setData(generateTestData(days));
          setLoading(false);
          return;
        }
        setError(null);
        setLoading(true);
        setProgress("Loading…");
        try {
          const result = await getCostData(selected, allSubs, days, msg => setProgress(msg), force);
          setData(result);
        } catch (e) {
          setError(e.message);
        } finally {
          setLoading(false);
          setProgress("");
        }
      }, [selected, allSubs, days, testMode]);

      useEffect(() => { load(false); }, [load]);

      // Toggle test mode — regenerate immediately
      const toggleTestMode = () => {
        const next = !testMode;
        setTestMode(next);
        if (next) { setData(generateTestData(days)); setLoading(false); }
        else { setData(null); setLoading(true); }
      };

      const stats   = useMemo(() => data ? calcStats(data.records, days) : null, [data, days]);
      const cacheAge = data ? Math.round((Date.now() - data.fetchedAt) / 60000) : 0;
      const groupOpt = GROUP_OPTS.find(o => o.id === groupId) || GROUP_OPTS[0];

      // Dark mode classes
      const bg    = dark ? "bg-gray-900" : "bg-slate-50";
      const hdrBg = dark ? "bg-gray-900 border-gray-700" : "bg-white border-slate-200";
      const filBg = dark ? "bg-gray-800 border-gray-700" : "bg-slate-50 border-slate-100";
      const segBg = dark ? "bg-gray-700 border-gray-600" : "bg-white border-slate-200";
      const segAct = dark ? "bg-gray-500 text-white" : "bg-slate-900 text-white";
      const segIn  = dark ? "text-gray-400 hover:bg-gray-600" : "text-slate-500 hover:bg-slate-100";
      const grpAct = "bg-blue-600 text-white";
      const grpIn  = dark ? "text-gray-400 hover:bg-gray-600" : "text-slate-500 hover:bg-slate-100";

      return (
        <DarkCtx.Provider value={dark}>
        <div className={cx("min-h-screen transition-colors duration-200", bg)}>

          {/* ── Top bar ─────────────────────────────────────────────────────── */}
          <div className={cx("border-b sticky top-0 z-20 shadow-sm", hdrBg)}>
            <div className="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <svg width="18" height="18" fill="none" stroke="#3b82f6" strokeWidth="2" viewBox="0 0 24 24">
                  <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                </svg>
                <span className={cx("font-semibold text-sm", dark ? "text-gray-100" : "text-slate-900")}>Azure Cost</span>
                {data && data.isTest && (
                  <span className="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-medium">TEST</span>
                )}
              </div>
              <div className="flex items-center gap-1.5">
                {/* Dark mode toggle */}
                <button onClick={() => { const n = !dark; setDark(n); try { localStorage.setItem("dark", n?"1":"0"); } catch {} }}
                  className={cx("w-7 h-7 flex items-center justify-center rounded-md text-lg transition-colors",
                    dark ? "bg-gray-700 hover:bg-gray-600" : "bg-slate-100 hover:bg-slate-200")}>
                  {dark ? "☀️" : "🌙"}
                </button>
                <button onClick={toggleTestMode}
                  className={cx("text-xs px-2 py-1 rounded border font-medium transition-colors",
                    testMode ? "bg-amber-500 text-white border-amber-500"
                             : dark ? "border-gray-600 text-gray-400 hover:bg-gray-700"
                             : "border-slate-200 text-slate-500 hover:bg-slate-50")}>
                  {testMode ? "Test data" : "Test"}
                </button>
                <button onClick={onChangeSubs} className={cx("text-xs px-2 py-1 rounded border font-medium transition-colors",
                  dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
                  Subs
                </button>
                <button onClick={onSignOut} className={cx("text-xs px-2 py-1 rounded font-medium transition-colors",
                  dark ? "text-gray-500 hover:bg-gray-700" : "text-slate-400 hover:bg-slate-100")}>
                  Out
                </button>
              </div>
            </div>

            {/* ── Filter bar: 2 rows, no overflow ──────────────────────────── */}
            <div className={cx("border-t px-4 py-2 space-y-2", filBg)}>
              {/* Row 1: date range + status + refresh */}
              <div className="flex items-center gap-2">
                <div className={cx("flex gap-0.5 rounded-md p-0.5 border flex-shrink-0", segBg)}>
                  {[7, 30, 90].map(n => (
                    <button key={n} onClick={() => setDays(n)}
                      className={cx("px-2.5 py-1 text-xs font-semibold rounded transition-colors",
                        days === n ? segAct : segIn)}>
                      {n}d
                    </button>
                  ))}
                </div>
                <div className="flex-1" />
                {data && (
                  <span className={cx("text-xs flex-shrink-0 hidden sm:block", dark ? "text-gray-500" : "text-slate-400")}>
                    {data.isTest ? "Test" : data.fromCache ? `${cacheAge}m ago` : "Fresh"} · {data.records.length.toLocaleString()}
                  </span>
                )}
                <button onClick={() => load(true)} disabled={loading}
                  className={cx("text-xs px-2 py-1 rounded border font-medium flex items-center gap-1 transition-colors",
                    dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
                  {loading ? <Spinner size={11} /> : "↻"} Refresh
                </button>
              </div>
              {/* Row 2: grouping (full width, wraps naturally) */}
              <div className={cx("flex gap-0.5 rounded-md p-0.5 border w-full", segBg)}>
                {GROUP_OPTS.map(o => (
                  <button key={o.id} onClick={() => setGroupId(o.id)}
                    className={cx("flex-1 py-1 text-xs font-semibold rounded transition-colors text-center",
                      groupId === o.id ? grpAct : grpIn)}>
                    {o.label}
                  </button>
                ))}
              </div>
            </div>
          </div>

          {/* ── Page content ─────────────────────────────────────────────────── */}
          <div className="max-w-5xl mx-auto px-4 py-4 space-y-4">
            <ErrMsg msg={error} />

            {/* Loading */}
            {loading && (
              <Card className="p-10">
                <div className="flex flex-col items-center gap-3">
                  <Spinner size={28} className="text-blue-400" />
                  <div className={cx("text-sm font-medium", dark ? "text-gray-300" : "text-slate-600")}>{progress}</div>
                  <div className={cx("text-xs text-center max-w-xs", dark ? "text-gray-500" : "text-slate-400")}>
                    First load may take 15–30s — PAYG API paginates 1,000 records at a time.
                  </div>
                </div>
              </Card>
            )}

            {/* Empty */}
            {!loading && data && data.records.length === 0 && (
              <Card className="p-8 text-center">
                <div className="text-3xl mb-2">🔍</div>
                <h3 className={cx("font-semibold", dark ? "text-gray-200" : "text-slate-700")}>No cost data found</h3>
                <p className={cx("text-sm mt-1", dark ? "text-gray-500" : "text-slate-500")}>
                  No usage records in the last {days} days. Try a wider range or switch to test data.
                </p>
              </Card>
            )}

            {/* Dashboard */}
            {!loading && data && data.records.length > 0 && stats && (
              <>
                {/* KPI row — compact single row */}
                <div className="grid grid-cols-4 gap-2" style={{marginBottom: 0}}>
                  <KpiCard label={`${days}d total`} value={fmt(stats.total, data.currency)} />
                  <KpiCard label="Daily avg"  value={fmt(stats.avgDaily, data.currency)} />
                  <KpiCard label="Peak day"   value={fmt(stats.peakDay.cost, data.currency)} sub={stats.peakDay.date ? stats.peakDay.date.slice(5) : ""} />
                  <KpiCard label="Trend"
                    value={stats.trendPct != null ? `${stats.trendPct > 0 ? "+" : ""}${stats.trendPct.toFixed(0)}%` : "N/A"}
                    trend={stats.trendPct} />
                </div>

                {/* Time series */}
                <TimeSeriesChart
                  records={data.records} currency={data.currency}
                  from={data.from} to={data.to} days={days}
                  groupOpt={groupOpt}
                  bucket={bucket} setBucket={setBucket}
                  style={style} setStyle={setStyle}
                />

                {/* Top movers — directly below time series */}
                <MoversCard records={data.records} days={days} currency={data.currency} groupOpt={groupOpt} />

                {/* Bar chart breakdown */}
                <GroupChart records={data.records} currency={data.currency} groupOpt={groupOpt} />

                {/* Detail table */}
                <DetailTable records={data.records} currency={data.currency} total={stats.total} groupOpt={groupOpt} />
              </>
            )}
          </div>
        </div>
        </DarkCtx.Provider>
      );
    }

    // =========================================================================
    // Root App
    // =========================================================================
    function App() {
      const [phase, setPhase]         = useState("init");
      const [subs, setSubs]           = useState([]);
      const [selected, setSelected]   = useState(new Set());
      const [busy, setBusy]           = useState(false);
      const [error, setError]         = useState(null);
      const [subsLoading, setSubsLoading] = useState(false);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const err  = params.get("error");

        if (err) {
          window.history.replaceState({}, "", window.location.pathname);
          setError(params.get("error_description") || err);
          setPhase("signin");
          return;
        }

        if (code) {
          window.history.replaceState({}, "", window.location.pathname);
          const verifier = sessionStorage.getItem("pkce_verifier");
          sessionStorage.removeItem("pkce_verifier");
          if (!verifier) {
            setError("Missing PKCE verifier — please try signing in again.");
            setPhase("signin");
            return;
          }
          setBusy(true);
          exchangeCode(code, verifier)
            .then(async resp => {
              kv.set("auth:token", makeToken(resp, null));
              await hydrate();
            })
            .catch(e => { setError(e.message); setPhase("signin"); })
            .finally(() => setBusy(false));
          return;
        }

        hydrate();
      }, []);

      async function hydrate() {
        try {
          const raw = kv.get("auth:token");
          if (!raw) { setPhase("signin"); return; }
          let t = JSON.parse(raw);
          if (t.expires_at <= Date.now() + 60_000) {
            if (!t.refresh_token) { setPhase("signin"); return; }
            const fresh = await doRefresh(t.refresh_token);
            t = makeToken(fresh, t.refresh_token);
            kv.set("auth:token", t);
          }
          setSubsLoading(true);
          const list = await listSubs(t.access_token);
          setSubs(list);
          const selRaw = kv.get("subs:selected");
          if (selRaw) {
            const ids = JSON.parse(selRaw);
            const valid = new Set(ids.filter(id => list.some(s => s.id === id)));
            if (valid.size > 0) {
              setSelected(valid);
              setPhase("dashboard");
              return;
            }
          }
          setPhase("subs");
        } catch (e) {
          console.error(e);
          setPhase("signin");
        } finally {
          setSubsLoading(false);
        }
      }

      const signIn = useCallback(async () => {
        setError(null); setBusy(true);
        try {
          const { verifier, challenge } = await makePkce();
          const state = b64url(randBytes(16).buffer);
          sessionStorage.setItem("pkce_verifier", verifier);
          sessionStorage.setItem("pkce_state", state);
          window.location.href = buildAuthUrl(challenge, state);
        } catch (e) { setError(e.message); setBusy(false); }
      }, []);

      const signOut = useCallback(() => {
        kv.del("auth:token"); kv.del("subs:selected");
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("cost:")) localStorage.removeItem(k);
          }
        } catch {}
        setSubs([]); setSelected(new Set()); setError(null);
        setPhase("signin");
      }, []);

      const toggleSub = id => setSelected(p => {
        const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n;
      });
      const selectAll = () => setSelected(
        selected.size === subs.length ? new Set() : new Set(subs.map(s => s.id))
      );
      const goToDashboard = () => {
        kv.set("subs:selected", JSON.stringify([...selected]));
        setPhase("dashboard");
      };

      if (phase === "init" || busy) return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center gap-3">
          <Spinner size={32} className="text-blue-400" />
          <p className="text-sm text-slate-400">{busy ? "Completing sign-in…" : "Loading…"}</p>
        </div>
      );

      if (phase === "signin") return <SignInScreen onSignIn={signIn} busy={busy} error={error} />;

      if (phase === "subs") return (
        <SubPicker subs={subs} selected={selected} onToggle={toggleSub}
          onSelectAll={selectAll} onContinue={goToDashboard}
          onSignOut={signOut} loading={subsLoading} />
      );

      if (phase === "dashboard") return (
        <Dashboard selected={selected} allSubs={subs}
          onChangeSubs={() => setPhase("subs")} onSignOut={signOut} />
      );

      return null;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
