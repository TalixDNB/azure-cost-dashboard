<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Azure Cost Dashboard</title>

  <!-- Visible error overlay in case React never loads -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var d = document.getElementById("__err");
      var m = document.getElementById("__errmsg");
      if (d && m) { d.style.display="block"; m.textContent += (err ? err.stack : msg) + "\n\n"; }
    };
    window.addEventListener("unhandledrejection", function(e) {
      var d = document.getElementById("__err");
      var m = document.getElementById("__errmsg");
      var msg = e.reason ? (e.reason.stack || e.reason.message || String(e.reason)) : String(e);
      if (d && m) { d.style.display="block"; m.textContent += msg + "\n\n"; }
    });
  </script>

  <!-- Core: React + ReactDOM from cdnjs (very reliable) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <!-- Babel for JSX transform -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js" crossorigin="anonymous"></script>

  <!-- Recharts deps: prop-types must come before recharts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/prop-types/15.8.1/prop-types.min.js" crossorigin="anonymous"></script>

  <!-- Recharts from cdnjs -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/recharts/2.12.7/Recharts.min.js" crossorigin="anonymous"></script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; }
    .spin { animation: _spin 1s linear infinite; }
    @keyframes _spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="__err" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#fff;z-index:99999;padding:20px;overflow:auto;font-family:monospace;">
  <h2 style="color:#ef4444;margin:0 0 8px">JavaScript Error</h2>
  <p style="font-size:13px;color:#64748b;margin:0 0 12px">Something went wrong loading the app. Error details:</p>
  <pre id="__errmsg" style="background:#fef2f2;border:1px solid #fecaca;padding:12px;border-radius:8px;font-size:12px;white-space:pre-wrap;color:#991b1b;"></pre>
  <button onclick="location.reload()" style="margin-top:12px;padding:8px 16px;background:#3b82f6;color:white;border:none;border-radius:6px;font-size:14px;cursor:pointer;">Reload</button>
</div>
<div id="root"></div>

  <script>
    // Safety check — if any critical library failed to load, show a message
    window.addEventListener("load", function() {
      if (!window.React || !window.ReactDOM || !window.Recharts) {
        document.getElementById("root").innerHTML =
          '<div style="padding:40px;text-align:center;color:#ef4444;font-family:sans-serif">' +
          '<h2>Failed to load dependencies</h2>' +
          '<p>Please check your internet connection and reload the page.</p>' +
          '<p style="font-size:12px;color:#94a3b8">Missing: ' +
          (!window.React ? "React " : "") +
          (!window.ReactDOM ? "ReactDOM " : "") +
          (!window.Recharts ? "Recharts" : "") + '</p></div>';
      }
    });
  </script>

  <script type="text/babel">
    const { useState, useEffect, useCallback, useMemo } = React;

    // Pull Recharts components safely
    const {
      LineChart, Line,
      AreaChart, Area,
      BarChart, Bar,
      XAxis, YAxis,
      CartesianGrid, Tooltip, Legend,
      ResponsiveContainer, Cell
    } = Recharts;

    // =========================================================================
    // CONFIG
    // =========================================================================
    const CLIENT_ID    = "dcdf39df-efdf-4f55-96fb-c24f4f9111ac";
    const TENANT       = "460bc2b5-594c-44eb-8930-8d13538d7f0e";
    const SCOPES       = "https://management.azure.com/user_impersonation offline_access openid profile";
    const AUTH_EP      = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/authorize`;
    const TOKEN_EP     = `https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token`;
    const ARM_BASE     = "https://management.azure.com";
    const REDIRECT_URI = "https://talixdnb.github.io/azure-cost-dashboard/";
    const CACHE_TTL_MS = 6 * 60 * 60 * 1000;

    // =========================================================================
    // TEST DATA — enriched synthetic dataset designed to trigger all alert types
    // =========================================================================
    function generateTestData(days) {
      // Each resource is designed to exercise a specific signal:
      // asp-prod-plan  → steady growth + forecast breach + new top driver
      // sql-prod-db    → sudden cost spike (unusual jump, high confidence)
      // vm-dev-build   → idle VM (low CPU in metrics, non-trivial cost)
      // vm-idle-extra  → idle VM (second VM, confirms pattern)
      // stg-prod-assets→ flat/stable, no signals (noise suppression check)
      // app-api-prod   → moderate growth, Watch tier
      // cog-search-prod→ new resource (grace period check, appears day 20+)
      // stg-staging    → falling cost, decreased mover
      // vnet-prod      → tiny cost, below noise floor
      const RESOURCES = [
        { name: "asp-prod-plan",    service: "Microsoft.Web",               rg: "rg-prod",    location: "australiaeast",  baseCost: 4.5,  signal: "growth"   },
        { name: "sql-prod-db",      service: "Microsoft.Sql",               rg: "rg-prod",    location: "australiaeast",  baseCost: 2.2,  signal: "spike"    },
        { name: "vm-dev-build",     service: "Microsoft.Compute",           rg: "rg-dev",     location: "southeastasia",  baseCost: 3.5,  signal: "idle"     },
        { name: "vm-idle-extra",    service: "Microsoft.Compute",           rg: "rg-dev",     location: "southeastasia",  baseCost: 2.1,  signal: "idle"     },
        { name: "stg-prod-assets",  service: "Microsoft.Storage",           rg: "rg-prod",    location: "australiaeast",  baseCost: 0.45, signal: "stable"   },
        { name: "app-api-prod",     service: "Microsoft.Web",               rg: "rg-prod",    location: "australiaeast",  baseCost: 1.1,  signal: "moderate" },
        { name: "stg-staging-data", service: "Microsoft.Storage",           rg: "rg-staging", location: "australiasouth", baseCost: 1.8,  signal: "falling"  },
        { name: "vnet-prod",        service: "Microsoft.Network",           rg: "rg-shared",  location: "australiaeast",  baseCost: 0.04, signal: "noise"    },
      ];

      // cog-search-prod is a "new" resource — only appears in last 3 days
      const NEW_RESOURCE = {
        name: "cog-search-prod", service: "Microsoft.CognitiveServices",
        rg: "rg-shared", location: "australiaeast", baseCost: 8.0, signal: "new"
      };

      const seed = (x) => Math.abs(Math.sin(x * 127.1 + 311.7));
      const today = new Date();
      const records = [];

      for (let d = days - 1; d >= 0; d--) {
        const dt = new Date(today);
        dt.setUTCDate(dt.getUTCDate() - d);
        const iso = dt.toISOString().slice(0, 10);
        const dayIndex = days - 1 - d;   // 0 = oldest day, days-1 = today
        const daysAgo  = d;               // days ago from today
        const dow = dt.getUTCDay();
        const weekend = (dow === 0 || dow === 6) ? 0.75 : 1.0;

        for (const res of RESOURCES) {
          const i = RESOURCES.indexOf(res);
          const noise = 0.88 + seed(dayIndex * 17 + i * 31) * 0.24;
          let cost = res.baseCost * weekend * noise;

          if (res.signal === "growth") {
            // Steady upward trend: doubles over the range
            const progress = dayIndex / Math.max(days - 1, 1);
            cost *= (1 + progress * 1.0);
          } else if (res.signal === "spike") {
            // Normal until last 8 days, then 4× spike — high-confidence unusual jump
            if (daysAgo <= 8) cost *= 4.2;
          } else if (res.signal === "idle") {
            // Constant cost (VM running but doing nothing)
            cost = res.baseCost * (0.95 + seed(dayIndex * 7 + i) * 0.1);
          } else if (res.signal === "moderate") {
            const progress = dayIndex / Math.max(days - 1, 1);
            cost *= (1 + progress * 0.35);
          } else if (res.signal === "falling") {
            const progress = dayIndex / Math.max(days - 1, 1);
            cost *= (1 - progress * 0.55);
          }
          // stable and noise: no modification

          records.push({
            date: iso, cost: parseFloat(Math.max(0, cost).toFixed(4)),
            currency: "AUD", service: res.service, resourceGroup: res.rg,
            resourceName: res.name, location: res.location, subName: "Test Subscription",
            resourceId: `/subscriptions/test-sub/resourceGroups/${res.rg}/providers/${res.service}/${res.name}`
          });
        }

        // New resource: only last 3 days (grace period test)
        if (daysAgo <= 2) {
          const noise = 0.9 + seed(dayIndex * 3) * 0.2;
          records.push({
            date: iso, cost: parseFloat((NEW_RESOURCE.baseCost * noise).toFixed(4)),
            currency: "AUD", service: NEW_RESOURCE.service, resourceGroup: NEW_RESOURCE.rg,
            resourceName: NEW_RESOURCE.name, location: NEW_RESOURCE.location,
            subName: "Test Subscription",
            resourceId: `/subscriptions/test-sub/resourceGroups/${NEW_RESOURCE.rg}/providers/${NEW_RESOURCE.service}/${NEW_RESOURCE.name}`
          });
        }
      }

      // Synthetic Monitor Metrics for VMs (simulates what the real API would return)
      // vm-dev-build and vm-idle-extra: near-zero CPU = idle
      const testMetrics = {
        "vm-dev-build":  { avgCpu7d: 1.2, maxCpu7d: 3.1,  avgNetwork7d: 0.8  },
        "vm-idle-extra": { avgCpu7d: 0.8, maxCpu7d: 2.4,  avgNetwork7d: 0.3  },
        "asp-prod-plan": { avgCpu7d: 42.1, maxCpu7d: 78.3, avgNetwork7d: 180.2 },
      };

      const from = new Date(today); from.setUTCDate(from.getUTCDate() - days);
      return {
        currency: "AUD", fetchedAt: Date.now(), isTest: true, fromCache: false, days,
        from: from.toISOString().slice(0, 10), to: today.toISOString().slice(0, 10),
        records, metrics: testMetrics
      };
    }


    // =========================================================================
    // PKCE
    // =========================================================================
    const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf)))
      .replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
    const randBytes = n => { const a = new Uint8Array(n); crypto.getRandomValues(a); return a; };
    const makePkce = async () => {
      const verifier  = b64url(randBytes(64).buffer);
      const challenge = b64url(await crypto.subtle.digest("SHA-256", new TextEncoder().encode(verifier)));
      return { verifier, challenge };
    };

    // =========================================================================
    // Storage (localStorage + in-memory fallback)
    // =========================================================================
    const _mem = {};
    const kv = {
      get(k)    { try { return localStorage.getItem(k); } catch { return _mem[k] ?? null; } },
      set(k, v) { const s = typeof v === "string" ? v : JSON.stringify(v);
                  try { localStorage.setItem(k, s); } catch { _mem[k] = s; } },
      del(k)    { try { localStorage.removeItem(k); } catch { delete _mem[k]; } }
    };

    // =========================================================================
    // Auth
    // =========================================================================
    function buildAuthUrl(challenge, state) {
      return `${AUTH_EP}?${new URLSearchParams({
        client_id: CLIENT_ID, response_type: "code",
        redirect_uri: REDIRECT_URI, scope: SCOPES,
        response_mode: "query", code_challenge: challenge,
        code_challenge_method: "S256", state, prompt: "select_account"
      })}`;
    }

    async function exchangeCode(code, verifier) {
      const res = await fetch(TOKEN_EP, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "authorization_code", client_id: CLIENT_ID,
          code, redirect_uri: REDIRECT_URI, code_verifier: verifier
        })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error_description || json.error || `Token exchange failed (${res.status})`);
      return json;
    }

    async function doRefresh(rt) {
      const res = await fetch(TOKEN_EP, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          grant_type: "refresh_token", client_id: CLIENT_ID,
          refresh_token: rt, scope: SCOPES
        })
      });
      const json = await res.json();
      if (!res.ok) throw new Error(json.error_description || json.error || "Refresh failed");
      return json;
    }

    function makeToken(resp, fallbackRt) {
      return {
        access_token:  resp.access_token,
        refresh_token: resp.refresh_token || fallbackRt,
        expires_at:    Date.now() + (resp.expires_in - 60) * 1000
      };
    }

    async function ensureValidToken() {
      const raw = kv.get("auth:token");
      if (!raw) throw new Error("Not signed in");
      const t = JSON.parse(raw);
      if (t.expires_at > Date.now() + 60_000) return t.access_token;
      if (!t.refresh_token) throw new Error("Session expired, please sign in again");
      const fresh = await doRefresh(t.refresh_token);
      const nt = makeToken(fresh, t.refresh_token);
      kv.set("auth:token", nt);
      return nt.access_token;
    }

    // =========================================================================
    // ARM API
    // =========================================================================
    async function armGet(url, at) {
      const fullUrl = url.startsWith("http") ? url : `${ARM_BASE}${url}`;
      const res = await fetch(fullUrl, { headers: { Authorization: `Bearer ${at}` } });
      if (res.status === 401) throw new Error("Session expired — please sign in again.");
      if (res.status === 403) throw new Error("Access denied. Make sure your account has Cost Management Reader on this subscription.");
      if (res.status === 429) {
        const wait = parseInt(res.headers.get("retry-after") || "15", 10);
        await new Promise(r => setTimeout(r, wait * 1000));
        return armGet(url, at);
      }
      if (!res.ok) {
        let msg = `API error ${res.status}`;
        try { const j = await res.json(); msg = j.error?.message || j.message || msg; } catch {}
        throw new Error(msg);
      }
      return res.json();
    }

    async function listSubs(at) {
      const j = await armGet("/subscriptions?api-version=2022-12-01", at);
      return (j.value || [])
        .map(s => ({ id: s.subscriptionId, name: s.displayName, state: s.state }))
        .sort((a, b) => a.name.localeCompare(b.name));
    }

    // Fetch CPU + network metrics for a VM resource over the last 7 days.
    // resourceId: full ARM path e.g. /subscriptions/.../providers/Microsoft.Compute/virtualMachines/name
    async function fetchVmMetrics(resourceId, at) {
      const to   = new Date().toISOString();
      const from = new Date(Date.now() - 7 * 86400000).toISOString();
      const url  = `${resourceId}/providers/microsoft.insights/metrics`
                 + `?api-version=2018-01-01`
                 + `&metricnames=${encodeURIComponent("Percentage CPU,Network In Total,Network Out Total")}`
                 + `&timespan=${encodeURIComponent(from + "/" + to)}`
                 + `&interval=P1D`
                 + `&aggregation=Average`;
      try {
        const j = await armGet(url, at);
        const getAvg = (metricName) => {
          const m = (j.value || []).find(v => v.name?.value === metricName);
          if (!m || !m.timeseries?.[0]?.data?.length) return null;
          const vals = m.timeseries[0].data.map(d => d.average).filter(v => v != null);
          return vals.length ? vals.reduce((s, v) => s + v, 0) / vals.length : null;
        };
        return {
          avgCpu7d:     getAvg("Percentage CPU")   ?? 0,
          avgNetwork7d: (getAvg("Network In Total") ?? 0) + (getAvg("Network Out Total") ?? 0)
        };
      } catch { return null; }
    }

    // Fetch metrics for all VMs found in records. Returns { [resourceName]: metrics }.
    async function fetchAllVmMetrics(records, at, onProgress) {
      const vms = {};
      for (const r of records) {
        if (r.service === "Microsoft.Compute" && r.resourceId && !vms[r.resourceName]) {
          vms[r.resourceName] = r.resourceId;
        }
      }
      const result = {};
      const names = Object.keys(vms);
      for (let i = 0; i < names.length; i++) {
        const name = names[i];
        if (onProgress) onProgress(`Fetching metrics: ${name} (${i+1}/${names.length})…`);
        const m = await fetchVmMetrics(vms[name], at);
        if (m) result[name] = m;
      }
      return result;
    }

    async function fetchUsageDetails(subId, from, to, at, onProgress) {
      const filter = `properties/usageStart ge '${from}' and properties/usageEnd le '${to}'`;
      let url = `/subscriptions/${subId}/providers/Microsoft.Consumption/usageDetails`
              + `?api-version=2019-10-01`
              + `&$filter=${encodeURIComponent(filter)}`
              + `&$top=1000`
              + `&metric=actualcost`;
      const all = [];
      let pages = 0;
      while (url && pages < 200) {
        const j = await armGet(url, at);
        if (Array.isArray(j.value)) all.push(...j.value);
        url = j.nextLink || null;
        pages++;
        if (onProgress) onProgress(all.length);
      }
      return all;
    }

    // Normalize service names — the API mixes casing (e.g. "microsoft.web" and "Microsoft.Storage")
    function normaliseService(s) {
      if (!s) return "Unknown";
      // Capitalize each segment split by dot; e.g. "microsoft.web" → "Microsoft.Web"
      return s.split(".").map(seg => {
        if (!seg) return seg;
        // Preserve all-caps segments (rare but possible)
        if (seg === seg.toUpperCase() && seg.length > 1) return seg;
        return seg.charAt(0).toUpperCase() + seg.slice(1).toLowerCase();
      }).join(".");
    }

    function normaliseRecord(r, subName) {
      const p = r.properties || {};
      const cost     = parseFloat(p.cost ?? p.costInBillingCurrency ?? p.pretaxCost ?? 0) || 0;
      const currency = p.billingCurrency ?? p.billingCurrencyCode ?? "USD";
      const date     = (p.date ?? p.usageStart ?? "").slice(0, 10);
      const service  = normaliseService(p.consumedService ?? p.meterCategory ?? "Unknown");
      const rg       = (p.resourceGroup ?? p.resourceGroupName ?? "—").toLowerCase() || "—";
      const resId    = p.instanceName ?? p.resourceId ?? p.instanceId ?? "";
      const resName  = resId ? resId.split("/").pop() || resId : (p.productOrderName || "—");
      const location = p.resourceLocation ?? p.location ?? "—";
      return {
        date, cost, currency, service,
        resourceGroup: rg,
        resourceName: resName || "—",
        location,
        subName
      };
    }

    // =========================================================================
    // Cost data fetch + cache
    // =========================================================================
    function cacheKey(subIds, days) {
      // v2: bumped after service-name normalization was added
      return `cost:v2:${[...subIds].sort().join(",")}:${days}`;
    }

    async function getCostData(selected, allSubs, days, onProgress, force) {
      const key = cacheKey([...selected], days);
      if (!force) {
        try {
          const raw = kv.get(key);
          if (raw) {
            const c = JSON.parse(raw);
            if (Date.now() - c.fetchedAt < CACHE_TTL_MS) return { ...c, fromCache: true };
          }
        } catch {}
      }

      const today = new Date();
      const from  = new Date(today); from.setDate(from.getDate() - days);
      const fromStr = from.toISOString().slice(0, 10);
      const toStr   = today.toISOString().slice(0, 10);

      const at = await ensureValidToken();
      const records = [];
      const subList = allSubs.filter(s => selected.has(s.id));

      for (let i = 0; i < subList.length; i++) {
        const sub = subList[i];
        if (onProgress) onProgress(`Fetching ${sub.name} (${i+1}/${subList.length})…`);
        const raw = await fetchUsageDetails(sub.id, fromStr, toStr, at,
          count => onProgress && onProgress(`${sub.name}: ${count.toLocaleString()} records…`));
        for (const r of raw) records.push(normaliseRecord(r, sub.name));
      }

      const currency = records.find(r => r.currency)?.currency || "USD";
      const data = { currency, fetchedAt: Date.now(), from: fromStr, to: toStr, days, records };
      try { kv.set(key, JSON.stringify(data)); } catch (e) { console.warn("Cache write failed", e); }
      return { ...data, fromCache: false };
    }

    // =========================================================================
    // Data helpers
    // =========================================================================
    function fmt(n, currency) {
      if (!n && n !== 0) return "—";
      try {
        return new Intl.NumberFormat(undefined, {
          style: "currency", currency,
          minimumFractionDigits: 2, maximumFractionDigits: 2
        }).format(n);
      } catch { return `${currency} ${n.toFixed(2)}`; }
    }

    function fmtCompact(n, currency) {
      if (!n && n !== 0) return "—";
      try {
        if (Math.abs(n) >= 1000) {
          return new Intl.NumberFormat(undefined, {
            style: "currency", currency, notation: "compact", maximumFractionDigits: 1
          }).format(n);
        }
        return fmt(n, currency);
      } catch { return fmt(n, currency); }
    }

    // Compact KPI formatter — narrow symbol + 1 decimal, no currency code repetition
    function fmtKpi(n, currency) {
      if (n == null || isNaN(n)) return "—";
      try {
        const sym = new Intl.NumberFormat("en", {
          style: "currency", currency, currencyDisplay: "narrowSymbol", maximumFractionDigits: 0
        }).format(0).replace(/[\d,.\s]/g,"").trim() || "";
        const abs = Math.abs(n);
        const pre = n < 0 ? "-" : "";
        if (abs >= 10000) return `${pre}${sym}${Math.round(abs/1000)}k`;
        if (abs >= 1000)  return `${pre}${sym}${(abs/1000).toFixed(1)}k`;
        if (abs >= 100)   return `${pre}${sym}${Math.round(abs)}`;
        return `${pre}${sym}${abs.toFixed(1)}`;
      } catch { return n.toFixed(1); }
    }

    // Auto-set per-resource absoluteMonthly budget at 115% of current monthly average.
    // Only overwrites existing entries if force=true.
    function initializeResourceBudgets(records, force) {
      const byResource = {};
      for (const r of records) {
        if (!byResource[r.resourceName]) byResource[r.resourceName] = { cost: 0, days: new Set() };
        byResource[r.resourceName].cost += r.cost;
        byResource[r.resourceName].days.add(r.date);
      }
      const g = ensureGlobalThreshold();
      let count = 0;
      for (const [name, data] of Object.entries(byResource)) {
        const key = `thresholds:resource:${name}`;
        if (!force && kv.get(key)) continue;
        const dailyAvg = data.cost / Math.max(data.days.size, 1);
        const budget   = Math.max(parseFloat((dailyAvg * 30 * 1.15).toFixed(2)), 0.50);
        kv.set(key, { absoluteMonthly: budget, momPct: g.momPct,
          tierAbsolute: g.tierAbsolute, tierPct: g.tierPct, enabled: true, _auto: true });
        count++;
      }
      return count;
    }

    // Total budget = sum of all per-resource absoluteMonthly thresholds.
    // Falls back to globalDefault for resources without a specific override.
    function computeTotalBudget(records) {
      const resources = new Set(records.map(r => r.resourceName));
      const globalDefault = ensureGlobalThreshold().absoluteMonthly || 50;
      let total = 0;
      for (const name of resources) {
        const raw = kv.get(`thresholds:resource:${name}`);
        total += raw ? (JSON.parse(raw).absoluteMonthly || 0) : globalDefault;
      }
      return parseFloat(total.toFixed(2));
    }

    // Adds per-group forecast keys ({g}_f) to a grouped series object.
    // Each group gets a daily rate computed from its recent bucketed values.
    // A bridge point is added to the last actual row so lines connect visually.
    // Future rows extend to end of current month (day/week) or next month (month bucket).
    function addForecastToSeries(gs, bucket) {
      if (!gs.rows.length) return gs;
      const today = new Date();
      const todayIso = today.toISOString().slice(0, 10);

      // Scale factor: convert bucketed value → daily rate
      const toDaily = { day: 1, week: 7, month: 30 };
      const toDB    = toDaily[bucket] || 1;

      // Compute daily rate per group from last 7 available bucketed rows
      const dailyRate = {};
      for (const g of gs.groupNames) {
        const vals = gs.rows
          .filter(r => r.key <= todayIso && r[g] != null)
          .slice(-7)
          .map(r => (r[g] || 0) / toDB);
        dailyRate[g] = computeSmartDailyRate(vals);
      }

      // Find last actual row index (latest row at or before today)
      let bridgeIdx = -1;
      for (let i = gs.rows.length - 1; i >= 0; i--) {
        if (gs.rows[i].key <= todayIso) { bridgeIdx = i; break; }
      }

      // Add bridge point on the last actual row so dashed line starts there
      if (bridgeIdx >= 0) {
        const bridge = gs.rows[bridgeIdx];
        for (const g of gs.groupNames) {
          bridge[`${g}_f`] = bridge[g] != null ? bridge[g] : dailyRate[g] * toDB;
        }
      }

      // Forecast end date
      const endDate = bucket === "month"
        ? new Date(today.getFullYear(), today.getMonth() + 2, 0)   // end of next month
        : new Date(today.getFullYear(), today.getMonth() + 1, 0);  // end of current month
      const endIso  = endDate.toISOString().slice(0, 10);

      // Generate future rows
      const seen = new Set(gs.rows.map(r => r.key));
      const futureRows = [];
      for (const iso of iterDays(todayIso, endIso)) {
        if (iso <= todayIso) continue;
        const { key, label } = bucketDate(iso, bucket);
        if (seen.has(key)) continue;
        seen.add(key);
        const row = { key, label };
        for (const g of gs.groupNames) {
          row[g] = null;
          row[`${g}_f`] = parseFloat((dailyRate[g] * toDB).toFixed(4));
        }
        futureRows.push(row);
      }

      if (futureRows.length) {
        gs.rows = [...gs.rows, ...futureRows];
        gs.rows.sort((a, b) => a.key.localeCompare(b.key));
      }
      gs.hasForecast = true;
      return gs;
    }

    function groupSum(records, keyFn) {
      const map = {};
      for (const r of records) {
        const k = keyFn(r) || "—";
        map[k] = (map[k] || 0) + r.cost;
      }
      return Object.entries(map)
        .map(([name, value]) => ({ name, value }))
        .sort((a, b) => b.value - a.value);
    }

    // Bucket a date string ("YYYY-MM-DD") into a label and sortable key
    // for the chosen bucket size. Returns { key, label }.
    function bucketDate(iso, bucket) {
      const d = new Date(iso);
      if (bucket === "month") {
        const y = d.getUTCFullYear();
        const m = d.getUTCMonth(); // 0-11
        const key = `${y}-${String(m + 1).padStart(2, "0")}`;
        const label = d.toLocaleString(undefined, { month: "short", year: "2-digit", timeZone: "UTC" });
        return { key, label };
      }
      if (bucket === "week") {
        // ISO week starts Monday; we use a simple week-of-year by snapping to Monday.
        const dt = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()));
        const day = dt.getUTCDay() || 7; // 1..7 (Mon..Sun)
        dt.setUTCDate(dt.getUTCDate() - (day - 1));
        const key = dt.toISOString().slice(0, 10);
        const label = `${dt.toLocaleString(undefined, { month: "short", day: "numeric", timeZone: "UTC" })}`;
        return { key, label };
      }
      // daily
      return { key: iso, label: iso.slice(5) };
    }

    // Determine the widest sensible default bucket given a date range in days.
    function defaultBucket(days) {
      if (days >= 90) return "month";
      if (days >= 30) return "week";
      return "day";
    }

    // Iterate every day from `from` to `to` inclusive.
    function* iterDays(from, to) {
      const cur = new Date(from), end = new Date(to);
      while (cur <= end) {
        yield cur.toISOString().slice(0, 10);
        cur.setUTCDate(cur.getUTCDate() + 1);
      }
    }

    // Build a flat (single-series) time series for the chosen bucket, no grouping.
    function buildTimeSeries(records, from, to, bucket, forecastPoints) {
      const sums = {};
      for (const r of records) {
        if (!r.date) continue;
        const { key, label } = bucketDate(r.date, bucket);
        sums[key] = (sums[key] || 0) + r.cost;
      }
      const keysSeen = new Set();
      const out = [];
      for (const iso of iterDays(from, to)) {
        const { key, label } = bucketDate(iso, bucket);
        if (keysSeen.has(key)) continue;
        keysSeen.add(key);
        out.push({ key, label, total: sums[key] || 0, forecast: null });
      }
      // Append forecast extension (only in daily bucket to keep chart clean)
      if (forecastPoints && bucket === "day") {
        // Anchor: set last actual point also as forecast start for smooth join
        if (out.length > 0) out[out.length - 1].forecast = out[out.length - 1].total;
        for (const fp of forecastPoints) {
          if (keysSeen.has(fp.key)) continue;
          keysSeen.add(fp.key);
          out.push({ key: fp.key, label: fp.label, total: null, forecast: fp.forecast });
        }
      }
      out.sort((a, b) => a.key.localeCompare(b.key));
      return out;
    }

    // Build a multi-series (grouped) time series: one column per top-N groups + "Other".
    // Returns { rows: [{ key, label, [groupName]: cost, ... }], groupNames: [...] }.
    function buildGroupedTimeSeries(records, from, to, bucket, keyFn, topN = 6) {
      // First, compute total cost per group across the whole range to find top N.
      const groupTotals = {};
      for (const r of records) {
        const g = keyFn(r) || "—";
        groupTotals[g] = (groupTotals[g] || 0) + r.cost;
      }
      const sortedGroups = Object.entries(groupTotals)
        .sort((a, b) => b[1] - a[1])
        .map(([g]) => g);
      const topGroups = sortedGroups.slice(0, topN);
      const otherGroups = new Set(sortedGroups.slice(topN));
      const includeOther = otherGroups.size > 0;
      const groupNames = includeOther ? [...topGroups, "Other"] : [...topGroups];

      // Build sums[bucketKey][groupName] = cost
      const sums = {};
      for (const r of records) {
        if (!r.date) continue;
        const { key } = bucketDate(r.date, bucket);
        const g = keyFn(r) || "—";
        const groupName = otherGroups.has(g) ? "Other" : g;
        if (!sums[key]) sums[key] = {};
        sums[key][groupName] = (sums[key][groupName] || 0) + r.cost;
      }

      // Walk every bucket in the date range to fill gaps
      const seen = new Set();
      const rows = [];
      for (const iso of iterDays(from, to)) {
        const { key, label } = bucketDate(iso, bucket);
        if (seen.has(key)) continue;
        seen.add(key);
        const row = { key, label };
        for (const g of groupNames) row[g] = (sums[key] && sums[key][g]) || 0;
        rows.push(row);
      }
      rows.sort((a, b) => a.key.localeCompare(b.key));
      return { rows, groupNames };
    }

    function calcStats(records, days) {
      const total = records.reduce((s, r) => s + r.cost, 0);
      const byDate = {};
      for (const r of records) byDate[r.date] = (byDate[r.date] || 0) + r.cost;
      let peakDay = { date: "—", cost: 0 };
      for (const [d, c] of Object.entries(byDate)) {
        if (c > peakDay.cost) peakDay = { date: d, cost: c };
      }
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - Math.floor(days / 2));
      const cutoffIso = cutoff.toISOString().slice(0, 10);
      const recent  = records.filter(r => r.date >= cutoffIso).reduce((s, r) => s + r.cost, 0);
      const earlier = records.filter(r => r.date <  cutoffIso).reduce((s, r) => s + r.cost, 0);
      const trendPct = earlier > 0.01 ? ((recent - earlier) / earlier) * 100 : null;
      return { total, avgDaily: total / days, peakDay, trendPct, recent, earlier };
    }

    function calcMovers(records, days, keyFn) {
      const cutoff = new Date();
      cutoff.setDate(cutoff.getDate() - Math.floor(days / 2));
      const cutoffIso = cutoff.toISOString().slice(0, 10);
      const first = {}, second = {};
      for (const r of records) {
        const k = keyFn(r) || "—";
        if (r.date >= cutoffIso) second[k] = (second[k] || 0) + r.cost;
        else first[k] = (first[k] || 0) + r.cost;
      }
      const keys = new Set([...Object.keys(first), ...Object.keys(second)]);
      const movers = [];
      for (const k of keys) {
        const before = first[k]  || 0;
        const after  = second[k] || 0;
        const delta  = after - before;
        if (Math.abs(delta) < 0.50) continue;
        movers.push({ name: k, before, after, delta });
      }
      return {
        increasing: movers.filter(m => m.delta > 0).sort((a, b) => b.delta - a.delta).slice(0, 5),
        decreasing: movers.filter(m => m.delta < 0).sort((a, b) => a.delta - b.delta).slice(0, 5)
      };
    }

    // =========================================================================
    // THRESHOLD SYSTEM
    // =========================================================================

    const THRESHOLD_DEFAULTS = {
      absoluteMonthly: 50,
      momPct: 25,
      popPct: 50,
      tierAbsolute: "warning",
      tierPct: "watch",
      enabled: true
    };

    // Ensure global defaults exist in localStorage on first use.
    // Always merges with THRESHOLD_DEFAULTS so new fields appear for existing users.
    function ensureGlobalThreshold() {
      const raw = kv.get("thresholds:global");
      if (!raw) {
        kv.set("thresholds:global", THRESHOLD_DEFAULTS);
        return { ...THRESHOLD_DEFAULTS };
      }
      const stored = JSON.parse(raw);
      // Merge: defaults fill in any keys missing from older stored versions
      const merged = { ...THRESHOLD_DEFAULTS, ...stored };
      // If we added new keys, persist the merged version
      if (Object.keys(merged).length !== Object.keys(stored).length) {
        kv.set("thresholds:global", merged);
      }
      return merged;
    }

    // Resolve the effective threshold for a resource using the cascade:
    // resource → rg → location → service → global
    function resolveThreshold(resourceName, service, rg, location) {
      const keys = [
        `thresholds:resource:${resourceName}`,
        `thresholds:rg:${rg}`,
        `thresholds:location:${location}`,
        `thresholds:service:${service}`,
        "thresholds:global"
      ];
      for (const k of keys) {
        const raw = kv.get(k);
        if (raw) {
          const t = JSON.parse(raw);
          if (t.enabled !== false) return { ...t, _key: k };
        }
      }
      return { ...THRESHOLD_DEFAULTS, _key: "thresholds:global" };
    }

    // Returns true if a non-global override exists for this resource.
    function hasOverride(resourceName, service, rg, location) {
      const keys = [
        `thresholds:resource:${resourceName}`,
        `thresholds:rg:${rg}`,
        `thresholds:location:${location}`,
        `thresholds:service:${service}`
      ];
      return keys.some(k => kv.get(k) !== null);
    }

    // List all active overrides across all scopes.
    function listOverrides() {
      const overrides = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || !k.startsWith("thresholds:") || k === "thresholds:global") continue;
          const raw = kv.get(k);
          if (raw) overrides.push({ key: k, ...JSON.parse(raw) });
        }
      } catch {}
      return overrides;
    }

    // =========================================================================
    // INTELLIGENCE ENGINE
    // =========================================================================

    const TIER_ORDER = { none: 0, watch: 1, warning: 2, critical: 3 };

    // Compute mean and stddev of an array of numbers.
    function stats1d(arr) {
      if (!arr.length) return { mean: 0, std: 0 };
      const mean = arr.reduce((s, v) => s + v, 0) / arr.length;
      const std  = Math.sqrt(arr.reduce((s, v) => s + (v - mean) ** 2, 0) / arr.length);
      return { mean, std };
    }

    // Simple linear regression slope (cost per day trend).
    function linRegSlope(vals) {
      const n = vals.length;
      if (n < 2) return 0;
      const xMean = (n - 1) / 2;
      const yMean = vals.reduce((s, v) => s + v, 0) / n;
      let num = 0, den = 0;
      for (let i = 0; i < n; i++) {
        num += (i - xMean) * (vals[i] - yMean);
        den += (i - xMean) ** 2;
      }
      return den === 0 ? 0 : num / den;
    }

    // Project month-end spend from records.
    // Compute a smart daily rate that handles sudden resource shutoffs and spikes.
    function computeSmartDailyRate(dailyCosts) {
      // dailyCosts: array of numbers (oldest → newest), one per day
      if (!dailyCosts.length) return 0;
      if (dailyCosts.length === 1) return dailyCosts[0];

      const last3  = dailyCosts.slice(-3);
      const last7  = dailyCosts.slice(-7);
      const prior  = dailyCosts.slice(0, -7);

      const avg = arr => arr.length ? arr.reduce((s, v) => s + v, 0) / arr.length : 0;
      const last3Avg  = avg(last3);
      const last7Avg  = avg(last7);
      const priorAvg  = avg(prior);

      // ① Turnoff detection: last 3 days < 5% of prior average → resource off
      if (priorAvg > 0.5 && last3Avg < priorAvg * 0.05) {
        return last3Avg; // near-zero
      }

      // ② Spike suppression: last 3 days > 5× prior → likely one-off spike
      // Use last 7 avg instead to avoid inflating forecast
      if (priorAvg > 0.5 && last3Avg > priorAvg * 5) {
        return last7Avg;
      }

      // ③ Sharp drop (not zero): last 3 days < 40% of prior → use recent rate only
      if (priorAvg > 0.5 && last3Avg < priorAvg * 0.40) {
        return last7Avg;
      }

      // ④ Normal case: weighted blend (recent 2×, prior 1×)
      if (prior.length >= 3) {
        return (last7Avg * 2 + priorAvg) / 3;
      }
      return last7Avg;
    }

    function projectMonthEnd(records, currency) {
      const now   = new Date();
      const daysInMonth = new Date(now.getUTCFullYear(), now.getUTCMonth() + 1, 0).getDate();
      const daysLeft = daysInMonth - now.getUTCDate();

      // Build daily cost map
      const byDate = {};
      for (const r of records) byDate[r.date] = (byDate[r.date] || 0) + r.cost;

      // Build sorted daily array from all data
      const sortedDates = Object.keys(byDate).sort();
      const dailyCosts  = sortedDates.map(d => byDate[d]);

      const dailyRate = computeSmartDailyRate(dailyCosts);

      // Month-to-date spend
      const monthStart = new Date(now.getUTCFullYear(), now.getUTCMonth(), 1).toISOString().slice(0, 10);
      const mtd = records.filter(r => r.date >= monthStart).reduce((s, r) => s + r.cost, 0);

      // Build per-day forecast points for chart extension (today+1 → end of month)
      const forecastPoints = [];
      for (let d = 1; d <= daysLeft; d++) {
        const dt = new Date(now);
        dt.setUTCDate(dt.getUTCDate() + d);
        forecastPoints.push({
          key:      dt.toISOString().slice(0, 10),
          label:    dt.toISOString().slice(5, 10),
          forecast: parseFloat((dailyRate).toFixed(4))
        });
      }

      return {
        mtd,
        projected: mtd + dailyRate * daysLeft,
        dailyRate,
        daysLeft,
        daysInMonth,
        currency,
        forecastPoints  // for chart extension
      };
    }

    // Compute alert "peak days" for chart markers.
    // Returns { [isoDate]: [alert] } for dates where signals peaked.
    function computeAlertDays(alerts, records, days) {
      const result = {};
      const byResource = {};
      for (const r of records) {
        if (!byResource[r.resourceName]) byResource[r.resourceName] = {};
        byResource[r.resourceName][r.date] = (byResource[r.resourceName][r.date] || 0) + r.cost;
      }

      for (const alert of alerts) {
        const recs = byResource[alert.resourceName];
        if (!recs) continue;
        const hasSpikeSignal = alert.triggers.some(t =>
          t.type === "unusual_jump" || t.type === "threshold_absolute" || t.type === "forecast_breach"
        );
        if (!hasSpikeSignal) continue;

        // Find the peak day in last 14 days for this resource
        const cutoff = new Date(); cutoff.setUTCDate(cutoff.getUTCDate() - 14);
        const cutoffIso = cutoff.toISOString().slice(0, 10);
        let peakDate = null, peakCost = 0;
        for (const [date, cost] of Object.entries(recs)) {
          if (date >= cutoffIso && cost > peakCost) { peakCost = cost; peakDate = date; }
        }
        if (peakDate) {
          if (!result[peakDate]) result[peakDate] = [];
          result[peakDate].push(alert);
        }
      }
      return result;
    }

    // Core intelligence function.
    // records: flat array of normalised cost records (all resources, all days)
    // thresholds: not needed directly — we call resolveThreshold per resource
    // metricsData: { [resourceName]: { avgCpu7d, maxCpu7d, avgNetwork7d } }
    // Returns: array of alert objects sorted by tier desc, then impact desc.
    function runIntelligence(records, metricsData, days) {
      if (!records || records.length === 0) return [];

      // Group records by resource
      const byResource = {};
      for (const r of records) {
        const k = r.resourceName || "—";
        if (!byResource[k]) byResource[k] = [];
        byResource[k].push(r);
      }

      // Determine total cost per resource across full range for rank tracking
      const resourceTotals = {};
      for (const [name, recs] of Object.entries(byResource)) {
        resourceTotals[name] = recs.reduce((s, r) => s + r.cost, 0);
      }
      const rankedResources = Object.entries(resourceTotals)
        .sort((a, b) => b[1] - a[1])
        .map(([name]) => name);

      // Prior-period ranking (first half of range)
      const cutoff = new Date();
      cutoff.setUTCDate(cutoff.getUTCDate() - Math.floor(days / 2));
      const cutoffIso = cutoff.toISOString().slice(0, 10);
      const priorTotals = {};
      for (const r of records) {
        if (r.date < cutoffIso) priorTotals[r.resourceName] = (priorTotals[r.resourceName] || 0) + r.cost;
      }
      const priorRanked = Object.entries(priorTotals)
        .sort((a, b) => b[1] - a[1])
        .map(([name]) => name);

      // Grace period: resources that first appear within last 48h
      const firstSeen = {};
      for (const r of records) {
        if (!firstSeen[r.resourceName] || r.date < firstSeen[r.resourceName]) {
          firstSeen[r.resourceName] = r.date;
        }
      }
      const twoDaysAgo = new Date();
      twoDaysAgo.setUTCDate(twoDaysAgo.getUTCDate() - 2);
      const twoDaysAgoIso = twoDaysAgo.toISOString().slice(0, 10);
      const inGracePeriod = (name) => firstSeen[name] >= twoDaysAgoIso;

      // Top 1% threshold for grace period bypass
      const allTotals = Object.values(resourceTotals).sort((a, b) => b - a);
      const top1pctCost = allTotals[Math.max(0, Math.floor(allTotals.length * 0.01))] || Infinity;

      const alerts = [];

      for (const [resourceName, recs] of Object.entries(byResource)) {
        const meta = recs[0]; // service, rg, location all same per resource
        const threshold = resolveThreshold(
          resourceName, meta.service, meta.resourceGroup, meta.location
        );
        const totalCost = resourceTotals[resourceName];
        const currency  = meta.currency || "AUD";

        const triggers   = [];  // { type, detail, confidenceAdd }
        let confidence   = 0;
        let tier         = "none";

        // Daily cost series for this resource
        const dailyCosts = {};
        for (const r of recs) dailyCosts[r.date] = (dailyCosts[r.date] || 0) + r.cost;
        const allDates = Object.keys(dailyCosts).sort();
        const costSeries = allDates.map(d => dailyCosts[d]);
        const recentSeries = costSeries.slice(-Math.floor(days / 2));
        const priorSeries  = costSeries.slice(0, Math.floor(days / 2));

        // ── Grace period ────────────────────────────────────────────────────
        const isNew = inGracePeriod(resourceName);
        if (isNew && totalCost < top1pctCost) {
          // In grace period and not extreme cost — skip all signals
          continue;
        }

        // ── Signal 1: Threshold breach ──────────────────────────────────────
        // Absolute: extrapolate period spend to monthly
        const periodDays = allDates.length || 1;
        const monthlyEstimate = (totalCost / periodDays) * 30;
        if (threshold.absoluteMonthly && monthlyEstimate > threshold.absoluteMonthly) {
          const excess = monthlyEstimate - threshold.absoluteMonthly;
          triggers.push({
            type: "threshold_absolute",
            detail: `Projected monthly spend ~${fmt(monthlyEstimate, currency)} exceeds ${fmt(threshold.absoluteMonthly, currency)} limit`,
            confidenceAdd: 35,
            tierAtLeast: threshold.tierAbsolute || "warning",
            impact: excess / 30 * days
          });
          confidence += 35;
        }

        // Percentage: recent half vs prior half
        const recentSum = recentSeries.reduce((s, v) => s + v, 0);
        const priorSum  = priorSeries.reduce((s, v) => s + v, 0);
        if (priorSum > 0.5 && threshold.momPct) {
          const pctChange = ((recentSum - priorSum) / priorSum) * 100;
          if (pctChange > threshold.momPct) {
            triggers.push({
              type: "threshold_pct",
              detail: `Cost up ${pctChange.toFixed(0)}% vs prior period (limit: ${threshold.momPct}%)`,
              confidenceAdd: 25,
              tierAtLeast: threshold.tierPct || "watch",
              impact: recentSum - priorSum
            });
            confidence += 25;
          }
        }

        // ── Signal 2: Unusual cost jump (z-score) ───────────────────────────
        if (costSeries.length >= 7) {
          const baselineSeries = costSeries.slice(0, -3); // exclude last 3 days
          const { mean, std } = stats1d(baselineSeries);
          if (std > 0.01) {
            const recentAvg = recentSeries.slice(-3).reduce((s, v) => s + v, 0) / 3;
            const z = (recentAvg - mean) / std;
            if (z > 2.0) {
              const add = z > 3 ? 35 : 20;
              triggers.push({
                type: "unusual_jump",
                detail: `Recent daily cost ${fmt(recentAvg, currency)} is ${z.toFixed(1)}σ above the ${Math.floor(days * 0.6)}-day average of ${fmt(mean, currency)}`,
                confidenceAdd: add,
                tierAtLeast: z > 3 ? "warning" : "watch",
                impact: (recentAvg - mean) * 30
              });
              confidence += add;
            }
          }
        }

        // ── Signal 3: Faster-than-expected growth ───────────────────────────
        if (costSeries.length >= 10) {
          const priorSlope  = linRegSlope(priorSeries);
          const recentSlope = linRegSlope(recentSeries);
          // Signal if recent slope is materially steeper than prior
          if (priorSlope > 0.01 && recentSlope > priorSlope * 2.0 && recentSeries.at(-1) > 1) {
            triggers.push({
              type: "growth_acceleration",
              detail: `Cost growth rate has doubled vs prior period (${(recentSlope / priorSlope).toFixed(1)}× steeper)`,
              confidenceAdd: 20,
              tierAtLeast: "watch",
              impact: recentSum - priorSum
            });
            confidence += 20;
          } else if (priorSlope <= 0.01 && recentSlope > 0.15 && recentSeries.at(-1) > 1) {
            // Was flat, now climbing
            triggers.push({
              type: "growth_acceleration",
              detail: `Cost was flat but is now climbing at ${fmt(recentSlope * 30, currency)}/month rate`,
              confidenceAdd: 15,
              tierAtLeast: "watch",
              impact: recentSlope * 30
            });
            confidence += 15;
          }
        }

        // ── Signal 4: New top cost driver ───────────────────────────────────
        const currentRank = rankedResources.indexOf(resourceName);
        const priorRank   = priorRanked.indexOf(resourceName);
        if (currentRank < 3 && (priorRank >= 5 || priorRank === -1) && totalCost > 2) {
          triggers.push({
            type: "new_top_driver",
            detail: `Moved into top ${currentRank + 1} most expensive resources (was ranked #${priorRank >= 0 ? priorRank + 1 : "unranked"} previously)`,
            confidenceAdd: 20,
            tierAtLeast: "watch",
            impact: totalCost
          });
          confidence += 20;
        }

        // ── Signal 5: Forecast breach ───────────────────────────────────────
        if (threshold.absoluteMonthly && recentSeries.length >= 3) {
          const dailyRate = recentSeries.slice(-7).reduce((s, v) => s + v, 0) /
                            Math.min(recentSeries.length, 7);
          const now = new Date();
          const daysLeft = new Date(now.getUTCFullYear(), now.getUTCMonth() + 1, 0).getDate() - now.getUTCDate();
          const monthStart = new Date(now.getUTCFullYear(), now.getUTCMonth(), 1).toISOString().slice(0, 10);
          const mtd = recs.filter(r => r.date >= monthStart).reduce((s, r) => s + r.cost, 0);
          const projected = mtd + dailyRate * daysLeft;
          if (projected > threshold.absoluteMonthly * 1.15 && !triggers.find(t => t.type === "threshold_absolute")) {
            triggers.push({
              type: "forecast_breach",
              detail: `On track to spend ${fmt(projected, currency)} this month (limit: ${fmt(threshold.absoluteMonthly, currency)})`,
              confidenceAdd: 25,
              tierAtLeast: "warning",
              impact: projected - threshold.absoluteMonthly
            });
            confidence += 25;
          }
        }

        // ── Signal 6: Idle VM (from metrics) ───────────────────────────────
        const metrics = metricsData && metricsData[resourceName];
        if (metrics && meta.service === "Microsoft.Compute") {
          const isIdle = metrics.avgCpu7d < 5 && metrics.avgNetwork7d < 5;
          const isVeryIdle = metrics.avgCpu7d < 2 && metrics.avgNetwork7d < 2;
          if (isIdle && totalCost > 0.5) {
            const add = isVeryIdle ? 35 : 20;
            triggers.push({
              type: "idle_vm",
              detail: `VM CPU avg ${metrics.avgCpu7d.toFixed(1)}% over 7 days with ${fmt(totalCost / periodDays * 30, currency)}/month cost. Appears unused.`,
              confidenceAdd: add,
              tierAtLeast: isVeryIdle ? "warning" : "watch",
              impact: totalCost / periodDays * 30,
              action: "Consider deallocating or resizing this VM to reduce costs."
            });
            confidence += add;
          }
        }

        // ── Skip if no triggers fired ───────────────────────────────────────
        if (triggers.length === 0) continue;

        // ── Confidence adjustments ──────────────────────────────────────────
        // Persistence: signal visible for >3 days adds confidence
        if (recentSeries.filter(v => v > 0).length >= 3 && triggers.length > 0) confidence += 10;
        // Impact bonus
        if (totalCost > 50) confidence += 20;
        else if (totalCost > 10) confidence += 10;
        // Data quality penalty
        if (costSeries.length < 5) confidence -= 20;
        if (costSeries.length < 3) confidence -= 15;
        // Multiple corroborating signals bonus
        if (triggers.length >= 2) confidence += 15;
        if (triggers.length >= 3) confidence += 10;

        confidence = Math.min(100, Math.max(0, confidence));

        // ── Confidence tier ─────────────────────────────────────────────────
        const confidenceTier = confidence >= 70 ? "high" : confidence >= 40 ? "medium" : "low";

        // Low confidence → no alert (may surface as soft indicator later)
        if (confidenceTier === "low") continue;

        // ── Alert tier from triggers ─────────────────────────────────────────
        // Take highest tier demanded by any trigger, bounded by confidence
        let demandedTier = "watch";
        for (const t of triggers) {
          if (TIER_ORDER[t.tierAtLeast] > TIER_ORDER[demandedTier]) {
            demandedTier = t.tierAtLeast;
          }
        }
        // High confidence + threshold breach → critical
        if (confidenceTier === "high" && triggers.some(t => t.type.startsWith("threshold"))) {
          demandedTier = "critical";
        }
        // Medium confidence caps at warning
        if (confidenceTier === "medium" && demandedTier === "critical") demandedTier = "warning";

        tier = demandedTier;

        // ── Build the primary reason string ─────────────────────────────────
        // Primary = highest-confidence trigger; secondary listed after
        const sortedTriggers = [...triggers].sort((a, b) => b.confidenceAdd - a.confidenceAdd);
        const primaryTrigger = sortedTriggers[0];
        const reason = primaryTrigger.detail;
        const impact = Math.max(...triggers.map(t => t.impact || 0));

        // ── Suggested action ─────────────────────────────────────────────────
        const actionMap = {
          threshold_absolute:  "Review this resource's configuration or set a higher budget threshold.",
          threshold_pct:       "Investigate what changed in the second half of this period.",
          unusual_jump:        "Check for unexpected deployments, data growth, or configuration changes.",
          growth_acceleration: "Investigate recent changes that may have increased resource usage.",
          new_top_driver:      "Determine if this resource's increased spending is expected.",
          forecast_breach:     "Review resource usage and consider rightsizing before month end.",
          idle_vm:             primaryTrigger.action || "Consider deallocating or resizing this VM."
        };
        const suggestedAction = actionMap[primaryTrigger.type] || "Review this resource.";

        alerts.push({
          resourceName,
          service:   meta.service,
          rg:        meta.resourceGroup,
          location:  meta.location,
          tier,
          confidence,
          confidenceTier,
          triggers,
          reason,
          impact,
          suggestedAction,
          totalCost,
          currency,
          isNew,
          hasOverride: hasOverride(resourceName, meta.service, meta.resourceGroup, meta.location)
        });
      }

      // Sort: critical first, then warning, then watch; within tier by impact desc
      return alerts.sort((a, b) =>
        TIER_ORDER[b.tier] - TIER_ORDER[a.tier] || b.impact - a.impact
      );
    }

    // =========================================================================
    // UI helpers
    // =========================================================================
    const cx = (...a) => a.filter(Boolean).join(" ");
    const PALETTE = ["#3b82f6","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4","#ec4899","#84cc16","#f97316","#6366f1"];

            "inline-flex items-center justify-center gap-1.5 rounded-lg font-medium transition-colors select-none",
            "disabled:opacity-40 disabled:cursor-not-allowed",
            small ? "text-xs px-2.5 py-1.5" : "text-sm px-4 py-2.5",
            variants[variant],
            full && "w-full"
          )}>
          {children}
        </button>

    }

    function ErrMsg({ msg }) {
      const dark = useDark();
      if (!msg) return null;

        <div className={cx("p-3.5 rounded-lg border text-sm",
          dark ? "bg-red-950 border-red-800 text-red-300" : "bg-red-50 border-red-200 text-red-800")}>

    // =========================================================================
    // Screens: Sign-in
    // =========================================================================
    function SignInScreen({ onSignIn, busy, error }) {

        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-5">

              <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-600 rounded-2xl shadow-lg mb-4">
                <svg width="30" height="30" fill="none" stroke="white" strokeWidth="2" viewBox="0 0 24 24">
                  <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                </svg>
              </div>
              <h1 className="text-2xl font-bold text-slate-900">Azure Cost Dashboard</h1>
              <p className="text-slate-500 text-sm mt-1">Personal read-only cost tracking</p>
            </div>

            <Card className="p-6">
              <div className="space-y-4">
                <Btn full onClick={onSignIn} disabled={busy}>
                  {busy

                  }

                <ErrMsg msg={error} />
                <p className="text-xs text-slate-400 text-center leading-relaxed">
                  You'll be redirected to Microsoft. Read-only access — we cannot modify your resources.

    // =========================================================================
    // Screens: Subscription picker
    // =========================================================================
    function SubPicker({ subs, selected, onToggle, onSelectAll, onContinue, onSignOut, loading }) {
      const allOn = subs.length > 0 && selected.size === subs.length;
      return (
        <div className="min-h-screen bg-gradient-to-br from-slate-50 to-blue-50 flex items-center justify-center p-4">
          <div className="w-full max-w-lg">

              <h2 className="text-xl font-bold text-slate-900">Choose subscriptions</h2>

            </div>
            <Card>
              <div className="px-4 py-3 border-b border-slate-100 flex items-center justify-between">
                <span className="text-xs text-slate-400 font-medium uppercase tracking-wide">
                  {loading ? "Loading…" : `${subs.length} subscription${subs.length !== 1 ? "s" : ""} found`}
                </span>
                {subs.length > 1 && (
                  <button onClick={onSelectAll} className="text-xs text-blue-600 hover:text-blue-700 font-medium">

                {!loading && subs.length === 0 && <p className="text-center py-8 text-sm text-slate-400">No subscriptions found.</p>}

                  const on = selected.has(s.id);
                  return (
                    <button key={s.id} onClick={() => onToggle(s.id)}
                      className="w-full flex items-center gap-3 px-4 py-3 text-left hover:bg-slate-50 transition-colors">

                        on ? "bg-blue-600 border-blue-600" : "border-slate-300")}>
                        {on && <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="3.5" strokeLinecap="round"><path d="M20 6L9 17l-5-5"/></svg>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="text-sm font-medium text-slate-900 truncate">{s.name}</div>
                        <div className="text-xs text-slate-400 font-mono">{s.id}</div>
                      </div>
                      <span className={cx("text-xs px-2 py-0.5 rounded-full font-medium flex-shrink-0",
                        s.state === "Enabled" ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500")}>
                        {s.state}
                      </span>
                    </button>

              </div>
              <div className="px-4 py-3 border-t border-slate-100 flex items-center justify-between">
                <Btn variant="ghost" onClick={onSignOut} small>Sign out</Btn>
                <Btn onClick={onContinue} disabled={selected.size === 0}>
                  Open dashboard →

        </div>
      );

    // =========================================================================
    // Dashboard: KPI Card
    // =========================================================================
    function KpiCard({ label, value, trend }) {
      const dark = useDark();
      const tColor = trend == null ? ""
        : trend > 0 ? (dark ? "text-rose-400" : "text-rose-600")
        : (dark ? "text-emerald-400" : "text-emerald-600");
      return (
        <div className={cx("rounded-xl border px-2.5 py-2",
          dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
          <div className={cx("text-xs leading-tight mb-0.5",
            dark ? "text-gray-500" : "text-slate-400")}>{label}</div>
          <div className="flex items-baseline gap-1 flex-wrap">
            <span className={cx("text-sm font-bold leading-tight",
              dark ? "text-gray-100" : "text-slate-900")}>{value}</span>
            {trend != null && (
              <span className={cx("text-xs font-semibold leading-tight flex-shrink-0", tColor)}>
                {trend > 0 ? "▲" : "▼"}{Math.abs(trend).toFixed(0)}%
              </span>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // Dashboard: Charts
    // =========================================================================
    const GROUP_OPTS = [
      { id: "service",       label: "Service",        plural: "services",        fn: r => r.service },
      { id: "resourceGroup", label: "Resource group",  plural: "resource groups", fn: r => r.resourceGroup },
      { id: "resourceName",  label: "Resource",        plural: "resources",       fn: r => r.resourceName },
      { id: "location",      label: "Location",        plural: "locations",       fn: r => r.location },
    ];

    // Dark mode context
    const DarkCtx = React.createContext(false);
    const useDark = () => React.useContext(DarkCtx);

    // Collapsible section wrapper
    function Section({ title, right, storageKey, children }) {
      const dark = useDark();
      const [open, setOpen] = useState(() => {
        try { const v = localStorage.getItem("section:" + storageKey); return v === null ? true : v === "1"; }
        catch { return true; }
      });
      const toggle = () => {
        const next = !open;
        setOpen(next);
        try { localStorage.setItem("section:" + storageKey, next ? "1" : "0"); } catch {}
      };
      return (
        <div className={cx("rounded-xl border shadow-sm overflow-hidden", dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
          <button onClick={toggle} className={cx(
            "w-full flex items-center justify-between px-4 py-3 text-left transition-colors",
            dark ? "hover:bg-gray-700" : "hover:bg-slate-50"
          )}>
            <div className="flex items-center gap-2">
              <span className={cx("text-sm font-semibold", dark ? "text-gray-100" : "text-slate-700")}>{title}</span>
              {right && <span className={cx("text-xs", dark ? "text-gray-400" : "text-slate-400")}>{right}</span>}
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
              strokeLinecap="round" className={cx("transition-transform flex-shrink-0", dark ? "text-gray-400" : "text-slate-400", open ? "" : "-rotate-90")}>
              <path d="M6 9l6 6 6-6"/>
            </svg>
          </button>
          {open && <div className={cx("border-t", dark ? "border-gray-700" : "border-slate-100")}>{children}</div>}
        </div>
      );
    }

    function TimeSeriesChart({ records, currency, from, to, days, groupOpt, bucket, setBucket, style, setStyle, forecast, alerts, budget }) {
      const dark = useDark();
      const [hiddenSeries, setHiddenSeries] = useState(new Set());
      const [alertPanel, setAlertPanel]     = useState(null); // { x, y, alerts }

      const isGrouped = groupOpt && groupOpt.id !== "total";

      // Compute alert day markers (only for spike/threshold signals)
      const alertDays = useMemo(() =>
        computeAlertDays(alerts || [], records, days),
      [alerts, records, days]);

      const series = useMemo(() => {
        // Both grouped and non-grouped use addForecastToSeries for per-group forecast.
        // Non-grouped: single "total" group.
        if (!isGrouped) {
          const flat = buildTimeSeries(records, from, to, bucket, null); // no legacy forecastPoints
          const gs = { rows: flat, groupNames: ["total"] };
          return addForecastToSeries(gs, bucket);
        }
        const gs = buildGroupedTimeSeries(records, from, to, bucket, groupOpt.fn, 6);
        return addForecastToSeries(gs, bucket);
      }, [records, from, to, bucket, isGrouped, groupOpt && groupOpt.id]);

      const BUCKET_OPTS = [
        { id: "day",   label: "Daily"   },
        { id: "week",  label: "Weekly"  },
        { id: "month", label: "Monthly" },
      ];

      const gridColor    = dark ? "#374151" : "#f1f5f9";
      const tickColor    = dark ? "#9ca3af" : "#94a3b8";
      const tooltipStyle = dark
        ? { background: "#1f2937", border: "1px solid #374151", borderRadius: 8, fontSize: 12 }
        : { borderRadius: 8, fontSize: 12, border: "1px solid #e2e8f0" };

      const visibleGroups = series.groupNames.filter(g => !hiddenSeries.has(g));

      const toggleSeries = (g) => {
        setHiddenSeries(prev => {
          const next = new Set(prev);
          // Don't allow hiding all series
          if (next.has(g)) { next.delete(g); }
          else if (visibleGroups.length > 1) { next.add(g); }
          return next;
        });
      };

      const customTooltip = ({ active, payload, label }) => {
        if (!active || !payload || !payload.length) return null;
        const actuals  = payload.filter(p => !p.dataKey.endsWith("_f") && p.dataKey !== "forecast" && p.value != null && p.value > 0);
        const fcst     = null; // forecasts shown visually, not in tooltip
        const total    = actuals.reduce((s, p) => s + p.value, 0);
        return (
          <div className="bg-white dark:bg-gray-800 border border-slate-200 rounded-lg shadow-md p-2.5 text-xs max-w-[240px]"
               style={tooltipStyle}>
            <div className="font-semibold text-slate-700 mb-1" style={{ color: dark ? "#e5e7eb" : "#334155" }}>{label}</div>
            {isGrouped && actuals.length > 1 && (
              <div className="flex justify-between gap-3 pb-1 mb-1 border-b border-slate-100">
                <span style={{ color: dark ? "#9ca3af" : "#64748b" }}>Total</span>
                <span className="font-semibold tabular-nums" style={{ color: dark ? "#f3f4f6" : "#0f172a" }}>{fmt(total, currency)}</span>
              </div>
            )}
            {actuals.sort((a, b) => b.value - a.value).map((p, i) => (
              <div key={i} className="flex justify-between gap-3 py-0.5">
                <span className="flex items-center gap-1.5 truncate">
                  <span className="w-2 h-2 rounded-full flex-shrink-0" style={{ background: p.color }} />
                  <span style={{ color: dark ? "#d1d5db" : "#475569" }}>{p.dataKey === "total" ? "Cost" : p.dataKey}</span>
                </span>
                <span className="tabular-nums font-medium" style={{ color: dark ? "#f3f4f6" : "#0f172a" }}>{fmt(p.value, currency)}</span>
              </div>
            ))}

          </div>
        );
      };

      // Custom dot to show alert markers on spike days
      const AlertDot = ({ cx, cy, payload, dataKey }) => {
        const dayAlerts = alertDays[payload.key];
        if (!dayAlerts || !dayAlerts.length || dataKey !== (isGrouped ? visibleGroups[0] : "total")) return null;
        const tier = dayAlerts[0].tier;
        const color = tier === "critical" ? "#ef4444" : tier === "warning" ? "#f59e0b" : "#3b82f6";
        return (
          <g>
            <circle cx={cx} cy={cy} r={5} fill={color} stroke="white" strokeWidth={1.5}
              style={{ cursor: "pointer" }}
              onClick={(e) => {
                e.stopPropagation();
                setAlertPanel(prev =>
                  prev && prev.key === payload.key ? null : { key: payload.key, label: payload.label, alerts: dayAlerts, x: cx, y: cy }
                );
              }} />
          </g>
        );
      };

      if (!series.rows.length) {
        return (
          <Section title="Cost over time" storageKey="time-series">
            <div className={cx("p-4 text-sm text-center", dark ? "bg-gray-800 text-gray-500" : "bg-white text-slate-400")}>No data in range.</div>
          </Section>
        );
      }

      const tsTitle = isGrouped ? `Cost by ${groupOpt.label.toLowerCase()}` : "Cost over time";
      const tsBucketLabel = BUCKET_OPTS.find(b => b.id === bucket)?.label.toLowerCase() || bucket;
      const dailyBudget = budget > 0 ? budget / 30 : null;
      const isStacked = style === "stacked";

      return (
        <Section title={tsTitle} right={`(${tsBucketLabel})`} storageKey="time-series">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
            {/* Controls */}
            <div className="flex flex-wrap items-center gap-2 mb-3">
              <div className={cx("flex gap-0.5 rounded-md p-0.5 border", dark ? "bg-gray-700 border-gray-600" : "bg-slate-100 border-slate-200")}>
                {BUCKET_OPTS.map(b => (
                  <button key={b.id} onClick={() => setBucket(b.id)}
                    className={cx("text-xs px-2.5 py-1 rounded font-medium transition-colors",
                      bucket === b.id ? (dark ? "bg-gray-500 text-white" : "bg-white text-slate-900 shadow-sm")
                                      : (dark ? "text-gray-400 hover:text-gray-200" : "text-slate-500 hover:text-slate-700"))}>
                    {b.label}
                  </button>
                ))}
              </div>
              {isGrouped && (
                <div className={cx("flex gap-0.5 rounded-md p-0.5 border", dark ? "bg-gray-700 border-gray-600" : "bg-slate-100 border-slate-200")}>
                  {["stacked", "lines"].map(s => (
                    <button key={s} onClick={() => setStyle(s)}
                      className={cx("text-xs px-2.5 py-1 rounded font-medium transition-colors capitalize",
                        style === s ? (dark ? "bg-gray-500 text-white" : "bg-white text-slate-900 shadow-sm")
                                    : (dark ? "text-gray-400 hover:text-gray-200" : "text-slate-500 hover:text-slate-700"))}>
                      {s}
                    </button>
                  ))}
                </div>
              )}
              {Object.keys(alertDays).length > 0 && (
                <span className={cx("text-xs flex items-center gap-1", dark ? "text-gray-500" : "text-slate-400")}>
                  <span className="w-2 h-2 rounded-full bg-amber-400 inline-block" /> tap dots for alerts
                </span>
              )}
            </div>

            {/* Chart */}
            <div style={{ height: 260, position: "relative" }}>
              <ResponsiveContainer width="100%" height="100%">
                {/* Shared forecast lines — rendered outside chart-type branches */}
                {(isGrouped && isStacked) ? (
                  <AreaChart data={series.rows} margin={{ top: 5, right: 5, bottom: 0, left: -10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={gridColor} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: tickColor }} interval="preserveStartEnd" />
                    <YAxis tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} width={55} />
                    <Tooltip content={customTooltip} />
                    {dailyBudget && (
                      <Recharts.ReferenceLine y={dailyBudget} stroke="#ef4444" strokeDasharray="5 3"
                        label={{ value: "Budget", fill: "#ef4444", fontSize: 10, position: "right" }} />
                    )}
                    {/* Stacked actual areas */}
                    {series.groupNames.filter(g => !hiddenSeries.has(g)).map((g, i) => (
                      <Area key={g} type="monotone" dataKey={g} stackId="1"
                        stroke={PALETTE[i % PALETTE.length]} fill={PALETTE[i % PALETTE.length]}
                        fillOpacity={0.5} strokeWidth={1.5}
                        dot={<AlertDot dataKey={g} />} />
                    ))}
                    {/* Per-group dashed forecast lines (not stacked, overlaid) */}
                    {series.groupNames.map((g, i) =>
                      !hiddenSeries.has(g) && series.rows.some(r => r[`${g}_f`] != null) ? (
                        <Line key={`${g}_f`} type="monotone" dataKey={`${g}_f`}
                          stroke={PALETTE[i % PALETTE.length]} strokeWidth={1.5}
                          strokeDasharray="5 3" strokeOpacity={0.8}
                          dot={false} activeDot={false} legendType="none" connectNulls={true} />
                      ) : null
                    )}
                  </AreaChart>
                ) : (
                  <LineChart data={series.rows} margin={{ top: 5, right: 5, bottom: 0, left: -10 }}>
                    <CartesianGrid strokeDasharray="3 3" stroke={gridColor} />
                    <XAxis dataKey="label" tick={{ fontSize: 10, fill: tickColor }} interval="preserveStartEnd" />
                    <YAxis tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} width={55} />
                    <Tooltip content={customTooltip} />
                    {dailyBudget && (
                      <Recharts.ReferenceLine y={dailyBudget} stroke="#ef4444" strokeDasharray="5 3"
                        label={{ value: "Budget", fill: "#ef4444", fontSize: 10, position: "right" }} />
                    )}
                    {/* Actual lines */}
                    {series.groupNames.filter(g => !hiddenSeries.has(g)).map((g, i) => (
                      <Line key={g} type="monotone" dataKey={g}
                        stroke={isGrouped ? PALETTE[i % PALETTE.length] : "#3b82f6"}
                        strokeWidth={2} dot={<AlertDot dataKey={g} />} activeDot={{ r: 4 }}
                        connectNulls={false} />
                    ))}
                    {/* Per-group dashed forecast lines */}
                    {series.groupNames.map((g, i) =>
                      !hiddenSeries.has(g) && series.rows.some(r => r[`${g}_f`] != null) ? (
                        <Line key={`${g}_f`} type="monotone" dataKey={`${g}_f`}
                          stroke={isGrouped ? PALETTE[i % PALETTE.length] : "#3b82f6"}
                          strokeWidth={1.5} strokeDasharray="5 3" strokeOpacity={0.8}
                          dot={false} activeDot={false} legendType="none" connectNulls={true} />
                      ) : null
                    )}
                  </LineChart>
                )}
              </ResponsiveContainer>

              {/* Floating alert panel */}
              {alertPanel && (
                <div className={cx(
                  "absolute z-10 rounded-xl border shadow-lg p-3 text-xs max-w-[220px]",
                  dark ? "bg-gray-800 border-gray-600" : "bg-white border-slate-200"
                )} style={{ top: Math.max(8, alertPanel.y - 80), left: Math.min(alertPanel.x - 10, 160) }}>
                  <div className="flex items-center justify-between mb-2">
                    <span className={cx("font-semibold", dark ? "text-gray-100" : "text-slate-800")}>{alertPanel.label}</span>
                    <button onClick={() => setAlertPanel(null)}
                      className={cx("text-xs", dark ? "text-gray-500 hover:text-gray-300" : "text-slate-400 hover:text-slate-600")}>✕</button>
                  </div>
                  {alertPanel.alerts.map((a, i) => {
                    const tc = TIER_CONFIG[a.tier] || TIER_CONFIG.watch;
                    return (
                      <div key={i} className="py-1 border-t border-slate-100 first:border-0">
                        <span className={cx("inline-block text-xs px-1.5 py-0.5 rounded-full font-bold mb-0.5", tc.badge)}>{tc.label}</span>
                        <div className={cx("font-medium", dark ? "text-gray-200" : "text-slate-700")}>{a.resourceName}</div>
                        <div className={cx(dark ? "text-gray-400" : "text-slate-500")}>{a.reason.slice(0, 80)}{a.reason.length > 80 ? "…" : ""}</div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>

            {/* Custom legend with click-to-toggle */}
            {isGrouped && (
              <div className={cx("flex flex-wrap gap-x-3 gap-y-1.5 mt-3 pt-3 border-t",
                dark ? "border-gray-700" : "border-slate-100")}>
                {series.groupNames.map((g, i) => {
                  const hidden = hiddenSeries.has(g);
                  return (
                    <button key={g} onClick={() => toggleSeries(g)}
                      className={cx("flex items-center gap-1.5 text-xs transition-opacity",
                        hidden ? "opacity-35" : "opacity-100",
                        dark ? "text-gray-400 hover:text-gray-200" : "text-slate-600 hover:text-slate-900")}>
                      <span className="w-2.5 h-2.5 rounded-sm flex-shrink-0 transition-opacity"
                        style={{ background: hidden ? (dark ? "#4b5563" : "#cbd5e1") : PALETTE[i % PALETTE.length] }} />
                      <span className="truncate max-w-[100px]" title={g}>{g}</span>
                    </button>
                  );
                })}
                {hiddenSeries.size > 0 && (
                  <button onClick={() => setHiddenSeries(new Set())}
                    className={cx("text-xs underline", dark ? "text-gray-500" : "text-slate-400")}>
                    show all
                  </button>
                )}
              </div>
            )}
          </div>
        </Section>
      );
    }

    function GroupChart({ records, currency, groupOpt }) {
      const dark = useDark();
      const data = useMemo(() => groupSum(records, groupOpt.fn).slice(0, 8), [records, groupOpt.id]);
      const gridColor = dark ? "#374151" : "#f1f5f9";
      const tickColor = dark ? "#9ca3af" : "#94a3b8";
      const labelColor = dark ? "#d1d5db" : "#334155";
