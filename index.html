      const tooltipStyle = dark ? { background: "#1f2937", border: "1px solid #374151", borderRadius: 8, fontSize: 12 }
                                : { borderRadius: 8, fontSize: 12 };
      return (
        <Section title={`Top by ${groupOpt.label.toLowerCase()}`} right="Top 8" storageKey="group-chart">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
            <div style={{ height: 260 }}>
              {data.length === 0
                ? <div className={cx("h-full flex items-center justify-center text-sm", dark ? "text-gray-500" : "text-slate-400")}>No data</div>
                : (
                  <ResponsiveContainer width="100%" height="100%">
                    <BarChart data={data} layout="vertical" margin={{ top: 0, right: 10, bottom: 0, left: 0 }}>
                      <CartesianGrid strokeDasharray="3 3" stroke={gridColor} horizontal={false} />
                      <XAxis type="number" tick={{ fontSize: 10, fill: tickColor }} tickFormatter={v => fmtCompact(v, currency)} />
                      <YAxis type="category" dataKey="name" tick={{ fontSize: 10, fill: labelColor }} width={110} />
                      <Tooltip formatter={v => [fmt(v, currency), "Cost"]} contentStyle={tooltipStyle} />
                      <Bar dataKey="value" radius={[0, 4, 4, 0]}>
                        {data.map((_, i) => <Cell key={i} fill={PALETTE[i % PALETTE.length]} />)}
                      </Bar>
                    </BarChart>
                  </ResponsiveContainer>
                )
              }
            </div>
          </div>
        </Section>
      );
    }

    function MoversCard({ records, days, currency, groupOpt }) {
      const dark = useDark();
      const { increasing, decreasing } = useMemo(
        () => calcMovers(records, days, groupOpt.fn),
        [records, days, groupOpt.id]
      );
      const riseColor = dark ? "text-rose-400" : "text-rose-600";
      const fallColor = dark ? "text-emerald-400" : "text-emerald-600";
      const muted = dark ? "text-gray-500" : "text-slate-400";
      const txt = dark ? "text-gray-200" : "text-slate-700";
      return (
        <Section title="Top movers" right={`by ${groupOpt.label.toLowerCase()}`} storageKey="movers">
          <div className={cx("p-4", dark ? "bg-gray-800" : "bg-white")}>
            <p className={cx("text-xs mb-3", muted)}>Second half vs first half of the period</p>
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div>
                <div className={cx("text-xs font-semibold mb-2", riseColor)}>▲ Increased</div>
                {increasing.length === 0
                  ? <p className={cx("text-xs", muted)}>None above threshold</p>
                  : increasing.map(m => (
                    <div key={m.name} className="flex items-center justify-between py-1 text-sm gap-2">
                      <span className={cx("truncate", txt)} title={m.name}>{m.name}</span>
                      <span className={cx("flex-shrink-0 font-semibold tabular-nums", riseColor)}>+{fmt(m.delta, currency)}</span>
                    </div>
                  ))
                }
              </div>
              <div>
                <div className={cx("text-xs font-semibold mb-2", fallColor)}>▼ Decreased</div>
                {decreasing.length === 0
                  ? <p className={cx("text-xs", muted)}>None above threshold</p>
                  : decreasing.map(m => (
                    <div key={m.name} className="flex items-center justify-between py-1 text-sm gap-2">
                      <span className={cx("truncate", txt)} title={m.name}>{m.name}</span>
                      <span className={cx("flex-shrink-0 font-semibold tabular-nums", fallColor)}>{fmt(m.delta, currency)}</span>
                    </div>
                  ))
                }
              </div>
            </div>
          </div>
        </Section>
      );
    }

    function DetailTable({ records, currency, total, groupOpt }) {
      const dark = useDark();
      const [q, setQ] = useState("");
      const rows = useMemo(() => {
        const map = {};
        for (const r of records) {
          const k = groupOpt.fn(r) || "—";
          if (!map[k]) map[k] = { name: k, cost: 0 };
          map[k].cost += r.cost;
        }
        let arr = Object.values(map).sort((a, b) => b.cost - a.cost);
        if (q) {
          const lq = q.toLowerCase();
          arr = arr.filter(r => r.name.toLowerCase().includes(lq));
        }
        return arr;
      }, [records, q, groupOpt.id]);

      const th = cx("px-4 py-2 text-left font-medium uppercase tracking-wide text-xs",
        dark ? "text-gray-400" : "text-slate-500");
      const thR = cx("px-4 py-2 text-right font-medium uppercase tracking-wide text-xs",
        dark ? "text-gray-400" : "text-slate-500");

      return (
        <Section title={`All ${groupOpt.plural}`} storageKey="detail-table">
          <div className={cx("px-4 py-2.5 flex items-center gap-2", dark ? "bg-gray-800" : "bg-white")}>
            <input type="text" placeholder={`Search ${groupOpt.plural}…`} value={q}
              onChange={e => setQ(e.target.value)}
              className={cx("text-sm rounded-md px-3 py-1.5 w-full focus:outline-none border",
                dark ? "bg-gray-700 border-gray-600 text-gray-100 placeholder-gray-500 focus:border-blue-500"
                     : "border-slate-200 focus:border-blue-400")} />
          </div>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead className={cx(dark ? "bg-gray-900" : "bg-slate-50")}>
                <tr>
                  <th className={th}>{groupOpt.label}</th>
                  <th className={thR}>Cost</th>
                  <th className={cx(thR, "hidden sm:table-cell")}>% of total</th>
                </tr>
              </thead>
              <tbody className={cx("divide-y", dark ? "divide-gray-700" : "divide-slate-100")}>
                {rows.length === 0 && (
                  <tr><td colSpan={3} className={cx("px-4 py-8 text-center text-sm", dark ? "text-gray-500" : "text-slate-400")}>No results</td></tr>
                )}
                {rows.slice(0, 100).map((r, i) => {
                  // Check if this item has a custom threshold override
                  const overrideKey = `thresholds:${groupOpt.id === "service" ? "service" : groupOpt.id === "resourceGroup" ? "rg" : groupOpt.id === "location" ? "location" : "resource"}:${r.name}`;
                  const rowHasOverride = kv.get(overrideKey) !== null;
                  return (
                    <tr key={i} className={cx("transition-colors", dark ? "hover:bg-gray-700" : "hover:bg-slate-50")}>
                      <td className={cx("px-4 py-2.5 font-medium max-w-[200px]", dark ? "text-gray-200" : "text-slate-900")} title={r.name}>
                        <div className="flex items-center gap-1.5 min-w-0">
                          <span className="truncate">{r.name}</span>
                          {rowHasOverride && (
                            <span title="Custom threshold set" className="w-1.5 h-1.5 rounded-full bg-blue-500 flex-shrink-0" />
                          )}
                        </div>
                      </td>
                      <td className={cx("px-4 py-2.5 text-right tabular-nums", dark ? "text-gray-200" : "text-slate-900")}>{fmt(r.cost, currency)}</td>
                      <td className={cx("px-4 py-2.5 text-right tabular-nums hidden sm:table-cell", dark ? "text-gray-500" : "text-slate-400")}>
                        {total > 0 ? ((r.cost / total) * 100).toFixed(1) + "%" : "—"}
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
            {rows.length > 100 && (
              <p className={cx("px-4 py-2.5 text-center text-xs", dark ? "text-gray-500 bg-gray-900" : "text-slate-400 bg-slate-50")}>
                Showing top 100 of {rows.length}
              </p>
            )}
          </div>
        </Section>
      );
    }

    // =========================================================================
    // INSIGHT CARDS (Pass 2)
    // =========================================================================

    const TIER_CONFIG = {
      critical: { label: "Critical", icon: "🔴",
        light: "bg-red-50 border-red-200",     dark_: "bg-red-950 border-red-900",
        badge: "bg-red-600 text-white",         text: "text-red-700",  darkText: "text-red-300" },
      warning:  { label: "Warning",  icon: "🟠",
        light: "bg-amber-50 border-amber-200",  dark_: "bg-amber-950 border-amber-900",
        badge: "bg-amber-500 text-white",       text: "text-amber-700", darkText: "text-amber-300" },
      watch:    { label: "Watch",    icon: "🔵",
        light: "bg-blue-50 border-blue-200",    dark_: "bg-blue-950 border-blue-900",
        badge: "bg-blue-500 text-white",        text: "text-blue-700",  darkText: "text-blue-300" },
    };

    const CONFIDENCE_CONFIG = {
      high:   { label: "High confidence",   dot: "bg-emerald-500" },
      medium: { label: "Med confidence",    dot: "bg-amber-500"   },
      low:    { label: "Low confidence",    dot: "bg-slate-400"   },
    };

    const TRIGGER_LABELS = {
      threshold_absolute:  "Threshold breach",
      threshold_pct:       "% threshold breach",
      unusual_jump:        "Unusual cost jump",
      growth_acceleration: "Accelerating growth",
      new_top_driver:      "New top cost driver",
      forecast_breach:     "Forecast breach",
      idle_vm:             "Idle VM detected",
    };

    function InsightCard({ alert, dark }) {
      const [expanded, setExpanded] = useState(false);
      const tc = TIER_CONFIG[alert.tier] || TIER_CONFIG.watch;
      const cc = CONFIDENCE_CONFIG[alert.confidenceTier] || CONFIDENCE_CONFIG.medium;
      const cardBg   = dark ? tc.dark_ : tc.light;
      const textMain = dark ? "text-gray-100" : "text-slate-900";
      const textMid  = dark ? "text-gray-300" : "text-slate-700";
      const textMuted= dark ? "text-gray-500" : "text-slate-500";

      return (
        <div className={cx("rounded-xl border p-4 space-y-2", cardBg)}>
          {/* Row 1: badge + resource + confidence */}
          <div className="flex flex-wrap items-center gap-2">
            <span className={cx("text-xs px-2 py-0.5 rounded-full font-bold", tc.badge)}>
              {tc.label}
            </span>
            <span className={cx("text-sm font-bold", textMain)}>{alert.resourceName}</span>
            {alert.hasOverride && (
              <span className="text-xs px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 font-medium">
                custom threshold
              </span>
            )}
            {alert.isNew && (
              <span className="text-xs px-1.5 py-0.5 rounded bg-amber-100 text-amber-700 font-medium">
                new resource
              </span>
            )}
            <div className="flex items-center gap-1 ml-auto flex-shrink-0">
              <span className={cx("w-2 h-2 rounded-full flex-shrink-0", cc.dot)} />
              <span className={cx("text-xs font-medium", textMuted)}>{cc.label}</span>
            </div>
          </div>

          {/* Row 2: service + rg */}
          <div className={cx("text-xs", textMuted)}>
            {alert.service} · {alert.rg}
            {alert.location && alert.location !== "—" ? ` · ${alert.location}` : ""}
          </div>

          {/* Row 3: reason */}
          <div className={cx("text-sm leading-snug", textMid)}>{alert.reason}</div>

          {/* Row 4: impact + action */}
          <div className="grid grid-cols-2 gap-2 text-xs">
            <div className={cx("rounded-lg p-2", dark ? "bg-black/20" : "bg-white/60")}>
              <div className={cx("font-medium mb-0.5", textMuted)}>Est. impact</div>
              <div className={cx("font-bold", textMain)}>{fmt(alert.impact, alert.currency)}/mo</div>
            </div>
            <div className={cx("rounded-lg p-2", dark ? "bg-black/20" : "bg-white/60")}>
              <div className={cx("font-medium mb-0.5", textMuted)}>Suggestion</div>
              <div className={cx("leading-tight", textMid)}>{alert.suggestedAction}</div>
            </div>
          </div>

          {/* Row 5: triggers (expandable) */}
          {alert.triggers.length > 1 && (
            <button onClick={() => setExpanded(v => !v)}
              className={cx("text-xs flex items-center gap-1 transition-colors", textMuted, dark ? "hover:text-gray-300" : "hover:text-slate-700")}>
              <span>{expanded ? "▲" : "▼"}</span>
              {alert.triggers.length} signals
            </button>
          )}
          {(expanded || alert.triggers.length === 1) && (
            <div className="space-y-1">
              {alert.triggers.map((t, i) => (
                <div key={i} className={cx("text-xs flex items-start gap-1.5", textMuted)}>
                  <span className="flex-shrink-0 mt-0.5">·</span>
                  <span><span className="font-medium">{TRIGGER_LABELS[t.type] || t.type}:</span> {t.detail}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function InsightCards({ alerts, dark }) {
      const [watchOpen, setWatchOpen] = useState(false);
      const critical = alerts.filter(a => a.tier === "critical");
      const warning  = alerts.filter(a => a.tier === "warning");
      const watch    = alerts.filter(a => a.tier === "watch");
      if (alerts.length === 0) return null;
      const hdr = dark ? "text-gray-100" : "text-slate-900";
      const muted = dark ? "text-gray-500" : "text-slate-500";
      const divider = dark ? "border-gray-700" : "border-slate-200";

      return (
        <div className={cx("rounded-xl border shadow-sm overflow-hidden", dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
          <div className={cx("px-4 py-3 flex items-center gap-2 border-b", divider)}>
            <span className={cx("text-sm font-semibold", hdr)}>Insights</span>
            <div className="flex gap-1.5">
              {critical.length > 0 && <span className="text-xs px-2 py-0.5 rounded-full bg-red-600 text-white font-bold">{critical.length} critical</span>}
              {warning.length  > 0 && <span className="text-xs px-2 py-0.5 rounded-full bg-amber-500 text-white font-bold">{warning.length} warning</span>}
              {watch.length    > 0 && <span className="text-xs px-2 py-0.5 rounded-full bg-blue-500 text-white font-bold">{watch.length} watch</span>}
            </div>
          </div>

          <div className="p-3 space-y-3">
            {/* Critical + Warning always visible */}
            {[...critical, ...warning].map((a, i) => (
              <InsightCard key={i} alert={a} dark={dark} />
            ))}

            {/* Watch: collapsed by default */}
            {watch.length > 0 && (
              <div>
                <button onClick={() => setWatchOpen(v => !v)}
                  className={cx("w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-medium transition-colors",
                    dark ? "bg-gray-700 hover:bg-gray-600 text-gray-300" : "bg-slate-100 hover:bg-slate-200 text-slate-600")}>
                  <span>{watchOpen ? "▲" : "▼"} Watch alerts ({watch.length})</span>
                  <span className={muted}>{watchOpen ? "Collapse" : "Show"}</span>
                </button>
                {watchOpen && (
                  <div className="mt-2 space-y-2">
                    {watch.map((a, i) => <InsightCard key={i} alert={a} dark={dark} />)}
                  </div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // =========================================================================
    // ALERTS TAB (Pass 3)
    // =========================================================================

    const SCOPE_TYPES = [
      { id: "service",  label: "Service" },
      { id: "rg",       label: "Resource group" },
      { id: "location", label: "Location" },
      { id: "resource", label: "Resource" },
    ];

    function ThresholdFields({ values, onChange, currency }) {
      const dark = useDark();
      const lbl = cx("block text-xs font-medium mb-1", dark ? "text-gray-400" : "text-slate-500");
      const inp = cx("w-full text-sm rounded-md px-3 py-1.5 border focus:outline-none",
        dark ? "bg-gray-700 border-gray-600 text-gray-100 focus:border-blue-500"
             : "bg-white border-slate-200 text-slate-900 focus:border-blue-400");
      const sel = cx(inp, "cursor-pointer");

      return (
        <div className="grid grid-cols-2 gap-3 mt-3">
          <div>
            <label className={lbl}>Absolute limit / month ({currency})</label>
            <input type="number" min="0" step="1" value={values.absoluteMonthly ?? ""}
              onChange={e => onChange({ ...values, absoluteMonthly: parseFloat(e.target.value) || 0 })}
              className={inp} placeholder="e.g. 50" />
          </div>
          <div>
            <label className={lbl}>Alert tier (absolute)</label>
            <select value={values.tierAbsolute || "warning"} onChange={e => onChange({ ...values, tierAbsolute: e.target.value })} className={sel}>
              <option value="watch">Watch</option>
              <option value="warning">Warning</option>
              <option value="critical">Critical</option>
            </select>
          </div>
          <div>
            <label className={lbl}>Month-over-month increase (%)</label>
            <input type="number" min="1" max="500" step="1" value={values.momPct ?? ""}
              onChange={e => onChange({ ...values, momPct: parseFloat(e.target.value) || 0 })}
              className={inp} placeholder="e.g. 25" />
          </div>
          <div>
            <label className={lbl}>Alert tier (% change)</label>
            <select value={values.tierPct || "watch"} onChange={e => onChange({ ...values, tierPct: e.target.value })} className={sel}>
              <option value="watch">Watch</option>
              <option value="warning">Warning</option>
              <option value="critical">Critical</option>
            </select>
          </div>

        </div>
      );
    }

    function GlobalDefaultsSection({ currency, onSaved }) {
      const dark = useDark();
      const [values, setValues] = useState(() => ensureGlobalThreshold());
      const [saved, setSaved] = useState(false);
      const bg    = dark ? "bg-gray-800"  : "bg-white";
      const hdr   = dark ? "text-gray-100": "text-slate-900";
      const muted = dark ? "text-gray-400": "text-slate-500";
      const divider = dark ? "border-gray-700" : "border-slate-100";

      const save = () => {
        kv.set("thresholds:global", values);
        setSaved(true);
        setTimeout(() => setSaved(false), 2000);
        if (onSaved) onSaved();
      };

      return (
        <div className={cx("rounded-xl border shadow-sm overflow-hidden", dark ? "border-gray-700" : "border-slate-200", bg)}>
          <div className={cx("px-4 py-3 border-b flex items-center justify-between", divider)}>
            <div>
              <span className={cx("text-sm font-semibold", hdr)}>Global defaults</span>
              <span className={cx("text-xs ml-2", muted)}>Applies to all resources unless overridden</span>
            </div>
          </div>
          <div className="px-4 pb-4">
            <ThresholdFields values={values} onChange={setValues} currency={currency} />
            <div className="flex justify-end mt-3">
              <button onClick={save}
                className="text-sm px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors">
                {saved ? "✓ Saved" : "Save defaults"}
              </button>
            </div>
          </div>
        </div>
      );
    }

    function OverrideRow({ override, onEdit, onDelete, dark }) {
      const [confirming, setConfirming] = useState(false);
      const parts   = override.key.split(":");
      const scope   = parts[1]; // service|rg|location|resource
      const target  = parts.slice(2).join(":");
      const scopeLabel = { service: "Service", rg: "Resource group", location: "Location", resource: "Resource" }[scope] || scope;
      const bg    = dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200";
      const text  = dark ? "text-gray-100" : "text-slate-900";
      const muted = dark ? "text-gray-400" : "text-slate-500";
      const globals = ensureGlobalThreshold();

      const diffs = [];
      if (override.absoluteMonthly !== globals.absoluteMonthly)
        diffs.push(`Absolute: ${override.absoluteMonthly}`);
      if (override.momPct !== globals.momPct)
        diffs.push(`MoM: ${override.momPct}%`);
      if (override.tierAbsolute !== globals.tierAbsolute)
        diffs.push(`Tier(abs): ${override.tierAbsolute}`);
      if (override.tierPct !== globals.tierPct)
        diffs.push(`Tier(%): ${override.tierPct}`);

      return (
        <div className={cx("flex items-center gap-3 px-4 py-3 border-b last:border-0", dark ? "border-gray-700" : "border-slate-100")}>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-2">
              <span className={cx("text-xs px-1.5 py-0.5 rounded font-medium", dark ? "bg-gray-700 text-gray-300" : "bg-slate-100 text-slate-600")}>
                {scopeLabel}
              </span>
              <span className={cx("text-sm font-medium truncate", text)}>{target}</span>
            </div>
            {diffs.length > 0 && (
              <div className={cx("text-xs mt-0.5", muted)}>{diffs.join(" · ")}</div>
            )}
          </div>
          <div className="flex items-center gap-1 flex-shrink-0">
            <button onClick={() => onEdit(override)}
              className={cx("text-xs px-2 py-1 rounded border transition-colors",
                dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
              Edit
            </button>
            {confirming
              ? <button onClick={() => { onDelete(override.key); setConfirming(false); }}
                  className="text-xs px-2 py-1 rounded bg-red-600 text-white font-medium">Confirm</button>
              : <button onClick={() => setConfirming(true)}
                  className={cx("text-xs px-2 py-1 rounded border transition-colors",
                    dark ? "border-gray-600 text-red-400 hover:bg-gray-700" : "border-slate-200 text-red-600 hover:bg-red-50")}>
                  Delete
                </button>
            }
          </div>
        </div>
      );
    }

    function AddOverrideSection({ records, currency, onSaved, editingOverride, onCancelEdit }) {
      const dark = useDark();
      const [scopeType, setScopeType] = useState(editingOverride ? editingOverride.key.split(":")[1] : "service");
      const [target, setTarget]       = useState(editingOverride ? editingOverride.key.split(":").slice(2).join(":") : "");
      const [values, setValues]       = useState(() => editingOverride ? { ...editingOverride } : { ...THRESHOLD_DEFAULTS });
      const [saved, setSaved]         = useState(false);
      const [error, setError]         = useState("");

      // Populate target options from records
      const targetOptions = useMemo(() => {
        if (!records) return [];
        const sets = { service: new Set(), rg: new Set(), location: new Set(), resource: new Set() };
        for (const r of records) {
          sets.service.add(r.service);
          sets.rg.add(r.resourceGroup);
          sets.location.add(r.location);
          sets.resource.add(r.resourceName);
        }
        return [...(sets[scopeType] || new Set())].filter(Boolean).sort();
      }, [records, scopeType]);

      const bg    = dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200";
      const hdr   = dark ? "text-gray-100" : "text-slate-900";
      const muted = dark ? "text-gray-400" : "text-slate-500";
      const sel   = cx("w-full text-sm rounded-md px-3 py-1.5 border focus:outline-none",
        dark ? "bg-gray-700 border-gray-600 text-gray-100 focus:border-blue-500"
             : "bg-white border-slate-200 text-slate-900 focus:border-blue-400");

      const save = () => {
        if (!target) { setError("Please select a target."); return; }
        if (values.absoluteMonthly <= 0) { setError("Absolute limit must be > 0."); return; }
        if (values.momPct < 1 || values.momPct > 500) { setError("MoM% must be 1–500."); return; }
        const key = `thresholds:${scopeType}:${target}`;
        kv.set(key, { ...values, enabled: true });
        setSaved(true);
        setTimeout(() => { setSaved(false); if (onSaved) onSaved(); }, 1200);
        setError("");
      };

      const cancel = () => { if (onCancelEdit) onCancelEdit(); };

      return (
        <div className={cx("rounded-xl border shadow-sm overflow-hidden", bg)}>
          <div className={cx("px-4 py-3 border-b flex items-center justify-between", dark ? "border-gray-700" : "border-slate-100")}>
            <span className={cx("text-sm font-semibold", hdr)}>
              {editingOverride ? "Edit override" : "Add override"}
            </span>
            {editingOverride && (
              <button onClick={cancel} className={cx("text-xs", muted, "hover:underline")}>Cancel</button>
            )}
          </div>
          <div className="px-4 pb-4 space-y-3">
            {/* Scope type */}
            <div className="mt-3">
              <div className={cx("text-xs font-medium mb-1.5", muted)}>Scope type</div>
              <div className={cx("flex gap-0.5 rounded-md p-0.5 border", dark ? "bg-gray-700 border-gray-600" : "bg-slate-100 border-slate-200")}>
                {SCOPE_TYPES.map(s => (
                  <button key={s.id} onClick={() => { setScopeType(s.id); setTarget(""); }}
                    className={cx("flex-1 py-1 text-xs font-semibold rounded transition-colors",
                      scopeType === s.id ? "bg-blue-600 text-white" : (dark ? "text-gray-400 hover:bg-gray-600" : "text-slate-600 hover:bg-white"))}>
                    {s.label}
                  </button>
                ))}
              </div>
            </div>
            {/* Target */}
            <div>
              <div className={cx("text-xs font-medium mb-1.5", muted)}>Target ({SCOPE_TYPES.find(s => s.id === scopeType)?.label})</div>
              <select value={target} onChange={e => setTarget(e.target.value)} className={sel}>
                <option value="">— Select —</option>
                {targetOptions.map(o => <option key={o} value={o}>{o}</option>)}
              </select>
            </div>
            {/* Threshold fields */}
            <ThresholdFields values={values} onChange={setValues} currency={currency} />
            {error && <div className="text-xs text-red-500">{error}</div>}
            <div className="flex justify-end">
              <button onClick={save}
                className="text-sm px-4 py-2 rounded-lg bg-blue-600 text-white font-medium hover:bg-blue-700 transition-colors">
                {saved ? "✓ Saved" : (editingOverride ? "Update override" : "Save override")}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ── Small icon buttons used in the drill-down list ──────────────────────
    function IconBtn({ title, onClick, children, danger, muted: isMuted }) {
      const dark = useDark();
      return (
        <button title={title} onClick={onClick}
          className={cx("w-7 h-7 flex items-center justify-center rounded-md transition-colors flex-shrink-0",
            danger ? (dark ? "text-red-400 hover:bg-red-950" : "text-red-500 hover:bg-red-50")
            : isMuted ? (dark ? "text-gray-600 hover:text-gray-400 hover:bg-gray-700" : "text-slate-300 hover:text-slate-500 hover:bg-slate-100")
            : (dark ? "text-gray-400 hover:bg-gray-700 hover:text-gray-200" : "text-slate-500 hover:bg-slate-100 hover:text-slate-700")
          )}>
          {children}
        </button>
      );
    }

    // Inline edit form that expands below a row
    function InlineThresholdEdit({ thresholdKey, initialValues, currency, onSave, onCancel }) {
      const dark = useDark();
      const [values, setValues] = useState({ ...initialValues });
      const [saved, setSaved]   = useState(false);
      const save = () => {
        kv.set(thresholdKey, { ...values, enabled: true });
        setSaved(true);
        setTimeout(() => { setSaved(false); onSave(); }, 800);
      };
      const bg  = dark ? "bg-gray-900 border-gray-700" : "bg-slate-50 border-slate-200";
      return (
        <div className={cx("px-4 py-3 border-t", bg, dark ? "border-gray-700" : "border-slate-100")}>
          <ThresholdFields values={values} onChange={setValues} currency={currency} />
          <div className="flex justify-between mt-3">
            <button onClick={onCancel}
              className={cx("text-xs px-3 py-1.5 rounded border font-medium",
                dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
              Cancel
            </button>
            <button onClick={save}
              className="text-xs px-3 py-1.5 rounded bg-blue-600 text-white font-medium hover:bg-blue-700">
              {saved ? "✓ Saved" : "Save override"}
            </button>
          </div>
        </div>
      );
    }

    // A single row in the drill-down list
    function DrillRow({ item, currency, editingKey, onEdit, onReset, onDrill, dark, onThresholdSaved }) {
      const isEditing = editingKey === item.key;
      const changePct = item.changePct;
      const overrideActive = item.hasOverride;
      const text  = dark ? "text-gray-100" : "text-slate-900";
      const muted = dark ? "text-gray-500" : "text-slate-400";
      const divider = dark ? "border-gray-700" : "border-slate-100";
      const rowBg   = dark ? "hover:bg-gray-700" : "hover:bg-slate-50";

      // Threshold display: compact "A$50 | 25%"
      const t = item.threshold;
      const threshStr = `${fmt(t.absoluteMonthly, currency)} | ${t.momPct}%`;
      const tierAbsStr = t.tierAbsolute || "watch";
      const tierPctStr = t.tierPct || "watch";
      const TIER_C = { critical: dark?"text-red-400":"text-red-600", warning: dark?"text-amber-400":"text-amber-600", watch: dark?"text-blue-400":"text-blue-500" };
      const TIER_BG = { critical: dark?"bg-red-950 border-red-900":"bg-red-50 border-red-200", warning: dark?"bg-amber-950 border-amber-900":"bg-amber-50 border-amber-200", watch: dark?"bg-blue-950 border-blue-900":"bg-blue-50 border-blue-200" };

      return (
        <>
          <div className={cx("flex items-center gap-2 px-3 py-2.5 border-b transition-colors", divider, rowBg)}>
            {/* Drill arrow (only on service/rg level) */}
            {onDrill && (
              <button onClick={onDrill} className={cx("flex-shrink-0", muted, "hover:text-blue-500")}>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M9 18l6-6-6-6"/></svg>
              </button>
            )}

            {/* Name */}
            <div className="flex-1 min-w-0">
              <div className={cx("text-xs font-semibold truncate", text)} title={item.name}>{item.name}</div>
              <div className="flex flex-wrap items-center gap-0.5 mt-0.5">
                <span className={cx("text-xs", muted)}>{threshStr}</span>
                <span className={cx("text-xs px-1 rounded border font-medium", TIER_BG[tierAbsStr])}>
                  <span className={TIER_C[tierAbsStr]}>{tierAbsStr}</span>
                </span>
                {tierPctStr !== tierAbsStr && (
                  <span className={cx("text-xs px-1 rounded border font-medium", TIER_BG[tierPctStr])}>
                    <span className={TIER_C[tierPctStr]}>{tierPctStr}%</span>
                  </span>
                )}
                {overrideActive && <span className="text-xs text-blue-400">●</span>}
              </div>
            </div>

            {/* Cost */}
            <div className="text-right flex-shrink-0">
              <div className={cx("text-xs font-bold tabular-nums", text)}>{fmt(item.cost, currency)}</div>
              {changePct != null && (
                <div className={cx("text-xs tabular-nums font-medium",
                  changePct > 10 ? (dark ? "text-rose-400" : "text-rose-600")
                  : changePct < -5 ? (dark ? "text-emerald-400" : "text-emerald-600")
                  : muted)}>
                  {changePct > 0 ? "▲" : "▼"}{Math.abs(changePct).toFixed(0)}%
                </div>
              )}
            </div>

            {/* Action icons */}
            <div className="flex items-center gap-0.5 flex-shrink-0">
              <IconBtn title="Set threshold" onClick={() => onEdit(item)}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
              </IconBtn>
              <IconBtn title="Reset to global default" onClick={() => onReset(item)} isMuted={!overrideActive} danger={false}>
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
              </IconBtn>
            </div>
          </div>

          {/* Inline edit form */}
          {isEditing && (
            <InlineThresholdEdit
              thresholdKey={item.key}
              initialValues={item.threshold}
              currency={currency}
              onSave={() => { onEdit(null); if (onThresholdSaved) onThresholdSaved(); }}
              onCancel={() => onEdit(null)}
            />
          )}
        </>
      );
    }

    function AlertsTab({ records, currency, onResetBudgets, onThresholdSaved }) {
      const dark = useDark();
      const [drillService, setDrillService] = useState(null);
      const [editingKey, setEditingKey]     = useState(null);
      const [refreshKey, setRefreshKey]     = useState(0);
      const refresh = () => { setRefreshKey(k => k + 1); setEditingKey(null); if (onThresholdSaved) onThresholdSaved(); };

      const bg     = dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200";
      const hdr    = dark ? "text-gray-100" : "text-slate-900";
      const muted  = dark ? "text-gray-400" : "text-slate-500";
      const divider= dark ? "border-gray-700" : "border-slate-100";
      const filBg  = dark ? "bg-gray-800" : "bg-white";

      // Build rows for current drill level
      const rows = useMemo(() => {
        if (!records.length) return [];
        const half = new Date(); half.setUTCDate(half.getUTCDate() - 15);
        const halfIso = half.toISOString().slice(0, 10);
        const map = {};

        for (const r of records) {
          const isService = drillService === null;
          const groupKey  = isService ? r.service : r.resourceName;
          if (!isService && r.service !== drillService) continue;
          if (!map[groupKey]) map[groupKey] = {
            name: groupKey, service: r.service, rg: r.resourceGroup,
            location: r.location, cost: 0, recent: 0, prior: 0, resourceId: r.resourceId
          };
          map[groupKey].cost += r.cost;
          if (r.date >= halfIso) map[groupKey].recent += r.cost;
          else map[groupKey].prior += r.cost;
        }

        const globalDef = ensureGlobalThreshold();
        return Object.values(map).sort((a, b) => b.cost - a.cost).map(item => {
          const isService = drillService === null;
          const key = isService
            ? `thresholds:service:${item.name}`
            : `thresholds:resource:${item.name}`;
          const rawThreshold = kv.get(key);
          let threshold = rawThreshold ? JSON.parse(rawThreshold) : { ...globalDef };

          // Service-level: auto-compute absoluteMonthly as sum of contained resource budgets
          if (isService) {
            const serviceResources = new Set(records.filter(r => r.service === item.name).map(r => r.resourceName));
            let serviceTotal = 0;
            for (const rn of serviceResources) {
              const rRaw = kv.get(`thresholds:resource:${rn}`);
              serviceTotal += rRaw ? (JSON.parse(rRaw).absoluteMonthly || 0) : (globalDef.absoluteMonthly || 50);
            }
            threshold = { ...threshold, absoluteMonthly: parseFloat(serviceTotal.toFixed(2)) };
          }

          return {
            ...item,
            key,
            changePct: item.prior > 0.01 ? ((item.recent - item.prior) / item.prior) * 100 : null,
            threshold,
            hasOverride: rawThreshold !== null,
          };
        });
      }, [records, drillService, refreshKey]);

      const handleEdit = (item) => {
        if (!item) { setEditingKey(null); return; }
        setEditingKey(editingKey === item.key ? null : item.key);
      };

      const handleReset = (item) => {
        kv.del(item.key);
        refresh();
      };

      const totalAlertCount = rows.filter(r => r.hasOverride).length;

      return (
        <div className="space-y-3">
          {/* Drill-down list */}
          <div className={cx("rounded-xl border shadow-sm overflow-hidden", bg)}>
            {/* Header row: breadcrumb + reset budgets */}
            <div className={cx("px-3 py-2.5 border-b flex items-center gap-2", divider)}>
              {drillService ? (
                <button onClick={() => { setDrillService(null); setEditingKey(null); }}
                  className={cx("flex items-center gap-1 text-xs font-medium transition-colors",
                    dark ? "text-blue-400 hover:text-blue-300" : "text-blue-600 hover:text-blue-700")}>
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round"><path d="M15 18l-6-6 6-6"/></svg>
                  All services
                </button>
              ) : null}
              <span className={cx("text-xs font-semibold", hdr)}>
                {drillService ? `${drillService} · resources` : "Services"}
              </span>
              <div className="ml-auto flex items-center gap-2">
                {totalAlertCount > 0 && (
                  <span className={cx("text-xs", muted)}>{totalAlertCount} override{totalAlertCount !== 1 ? "s" : ""}</span>
                )}
                {onResetBudgets && !drillService && (
                  <button onClick={() => { if (confirm("Reset all budgets to 115% of current spend?")) { onResetBudgets(); setRefreshKey(k => k+1); }}}
                    className={cx("text-xs px-2 py-1 rounded border transition-colors flex items-center gap-1",
                      dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-500 hover:bg-slate-50")}>
                    <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    Reset budgets
                  </button>
                )}
              </div>
            </div>

            {/* Column headers */}
            <div className={cx("flex items-center gap-2 px-3 py-1 border-b text-xs font-medium",
              dark ? "bg-gray-900 border-gray-700 text-gray-500" : "bg-slate-50 border-slate-100 text-slate-400")}>
              <div className="w-3 flex-shrink-0" />
              <div className="flex-1">Name · Threshold</div>
              <div className="w-16 text-right flex-shrink-0">Cost</div>
              <div className="w-14 flex-shrink-0" />
            </div>

            {/* Rows */}
            {records.length === 0 && (
              <div className={cx("px-4 py-8 text-sm text-center", muted)}>
                Load cost data first to configure thresholds.
              </div>
            )}
            {rows.map((item, i) => (
              <DrillRow key={i} item={item} currency={currency}
                editingKey={editingKey} dark={dark}
                onEdit={handleEdit}
                onReset={handleReset}
                onThresholdSaved={onThresholdSaved}
                onDrill={drillService === null ? () => { setDrillService(item.name); setEditingKey(null); } : null}
              />
            ))}
          </div>
        </div>
      );
    }

    // Compact budget progress bar
    function BudgetBar({ mtd, projected, budget, currency, dark, onSetBudget }) {
      const muted0 = dark ? "text-gray-500" : "text-slate-400";
      if (!budget || budget <= 0) {
        return (
          <button onClick={onSetBudget}
            className={cx("w-full text-xs px-4 py-2 rounded-xl border border-dashed transition-colors text-left",
              dark ? "border-gray-700 text-gray-600 hover:border-gray-500 hover:text-gray-400"
                   : "border-slate-200 text-slate-400 hover:border-slate-300 hover:text-slate-500")}>
            + Set a monthly budget to track spend against it
          </button>
        );
      }
      const pct = Math.min((mtd / budget) * 100, 100);
      const projPct = Math.min((projected / budget) * 100, 110);
      const overBudget = projected > budget;
      const barColor = pct < 70 ? "#22c55e" : pct < 90 ? "#f59e0b" : "#ef4444";
      const bg = dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200";
      const muted = dark ? "text-gray-500" : "text-slate-400";
      const text  = dark ? "text-gray-200" : "text-slate-700";
      return (
        <div className={cx("rounded-xl border shadow-sm px-4 py-2.5", bg)}>
          <div className="flex items-center justify-between mb-1.5 gap-2">
            <span className={cx("text-xs font-medium", text)}>Monthly budget</span>
            <span className={cx("text-xs tabular-nums", overBudget ? "text-rose-500 font-semibold" : muted)}>
              {fmt(mtd, currency)} <span className={muted}>of</span> {fmt(budget, currency)}
              {projected > mtd && <span className={muted}> · forecast {fmt(projected, currency)}</span>}
            </span>
          </div>
          {/* Track */}
          <div className={cx("relative h-1.5 rounded-full overflow-visible", dark ? "bg-gray-700" : "bg-slate-100")}>
            {/* Actual spend */}
            <div className="absolute top-0 left-0 h-full rounded-full transition-all duration-500"
              style={{ width: `${pct}%`, background: barColor }} />
            {/* Forecast marker (dashed line at projected %) */}
            {projected > mtd && projPct <= 110 && (
              <div className="absolute top-1/2 -translate-y-1/2 w-0.5 h-3 rounded-full bg-blue-400 opacity-70"
                style={{ left: `${Math.min(projPct, 100)}%` }} title={`Forecast: ${fmt(projected, currency)}`} />
            )}
          </div>
          {overBudget && (
            <div className="text-xs text-rose-500 mt-1 font-medium">Over budget by {fmt(projected - budget, currency)}</div>
          )}
        </div>
      );
    }

    // =========================================================================
    // DASHBOARD (Pass 2+3: tabs, insight cards, alerts tab)
    // =========================================================================
    function Dashboard({ selected, allSubs, onChangeSubs, onSignOut }) {
      const [days, setDays]         = useState(30);
      const [data, setData]         = useState(null);
      const [loading, setLoading]   = useState(true);
      const [progress, setProgress] = useState("");
      const [error, setError]       = useState(null);
      const [testMode, setTestMode] = useState(false);
      const [dark, setDark]         = useState(() => { try { return localStorage.getItem("dark") === "1"; } catch { return false; } });
      const [activeTab, setActiveTab]     = useState("home");
      const [thresholdVersion, setThresholdVersion] = useState(0);
      const bumpThresholds = useCallback(() => setThresholdVersion(v => v + 1), []);

      // Shared grouping
      const [groupId, setGroupId] = useState("service");
      const [bucket, setBucket]   = useState(() => defaultBucket(30));
      const [style, setStyle]     = useState("stacked");

      useEffect(() => { setBucket(defaultBucket(days)); }, [days]);

      // metricsData: { [resourceName]: { avgCpu7d, avgNetwork7d } }
      // Populated from test data immediately, or from Monitor API after cost load.
      const [metricsData, setMetricsData]   = useState({});
      const [metricsStatus, setMetricsStatus] = useState(""); // "" | "loading" | "done" | "error"

      const load = useCallback(async (force = false) => {
        if (testMode) {
          const td = generateTestData(days);
          setData(td);
          setMetricsData(td.metrics || {});
          setLoading(false);
          return;
        }
        setError(null); setLoading(true); setProgress("Loading…");
        setMetricsData({}); setMetricsStatus("");
        try {
          const result = await getCostData(selected, allSubs, days, msg => setProgress(msg), force);
          setData(result);
          initializeResourceBudgets(result.records, false); // auto-set resource budgets on first load
        } catch (e) { setError(e.message); }
        finally { setLoading(false); setProgress(""); }
      }, [selected, allSubs, days, testMode]);

      // After cost data loads (real mode), fetch VM metrics in background
      useEffect(() => {
        if (!data || data.isTest || metricsStatus === "loading" || metricsStatus === "done") return;
        const vms = data.records.filter(r => r.service === "Microsoft.Compute" && r.resourceId);
        if (vms.length === 0) return;
        setMetricsStatus("loading");
        (async () => {
          try {
            const at = await ensureValidToken();
            const m  = await fetchAllVmMetrics(data.records, at,
              msg => setProgress(msg));
            setMetricsData(m);
            setMetricsStatus("done");
          } catch (e) {
            console.warn("Metrics fetch failed:", e);
            setMetricsStatus("error");
          } finally { setProgress(""); }
        })();
      }, [data]);

      useEffect(() => { load(false); }, [load]);

      const toggleTestMode = () => {
        const next = !testMode;
        setTestMode(next);
        if (next) { const td = generateTestData(days); setData(td); setMetricsData(td.metrics||{}); initializeResourceBudgets(td.records, false); setLoading(false); }
        else { setData(null); setLoading(true); }
      };

      const stats    = useMemo(() => data ? calcStats(data.records, days) : null, [data, days]);
      const cacheAge = data ? Math.round((Date.now() - data.fetchedAt) / 60000) : 0;
      const groupOpt = GROUP_OPTS.find(o => o.id === groupId) || GROUP_OPTS[0];

      const alerts = useMemo(() => {
        if (!data || !data.records.length) return [];
        ensureGlobalThreshold();
        return runIntelligence(data.records, metricsData, days);
      }, [data, metricsData, days, thresholdVersion]);

      const forecast = useMemo(() => data ? projectMonthEnd(data.records, data.currency) : null, [data]);
      // Re-read monthly budget reactively (re-evaluates when alerts change since
      // threshold saves trigger a re-run of runIntelligence).
      // Total budget = sum of all per-resource absoluteMonthly thresholds (auto-calculated)
      const totalBudget = useMemo(() =>
        data ? computeTotalBudget(data.records) : 0,
      [data, thresholdVersion]);

      // Dark mode class helpers
      const bg     = dark ? "bg-gray-900"  : "bg-slate-50";
      const hdrBg  = dark ? "bg-gray-900 border-gray-700"  : "bg-white border-slate-200";
      const filBg  = dark ? "bg-gray-800 border-gray-700"  : "bg-slate-50 border-slate-100";
      const segBg  = dark ? "bg-gray-700 border-gray-600"  : "bg-white border-slate-200";
      const segAct = dark ? "bg-gray-500 text-white"        : "bg-slate-900 text-white";
      const segIn  = dark ? "text-gray-400 hover:bg-gray-600" : "text-slate-500 hover:bg-slate-100";
      const grpAct = "bg-blue-600 text-white";
      const grpIn  = dark ? "text-gray-400 hover:bg-gray-600" : "text-slate-500 hover:bg-slate-100";
      const textMain = dark ? "text-gray-100" : "text-slate-900";
      const textMuted= dark ? "text-gray-500" : "text-slate-500";

      return (
        <DarkCtx.Provider value={dark}>
        <div className={cx("min-h-screen transition-colors duration-200", bg)}>

          {/* ── Sticky header ────────────────────────────────────────────────── */}
          <div className={cx("border-b sticky top-0 z-20 shadow-sm", hdrBg)}>

            {/* Row 1: logo + actions */}
            <div className="max-w-5xl mx-auto px-4 py-2.5 flex items-center justify-between gap-2">
              <div className="flex items-center gap-2">
                <svg width="18" height="18" fill="none" stroke="#3b82f6" strokeWidth="2" viewBox="0 0 24 24">
                  <path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/>
                </svg>
                <span className={cx("font-semibold text-sm", textMain)}>Azure Cost</span>
                {data && data.isTest && (
                  <span className="text-xs bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded font-medium">TEST</span>
                )}
              </div>
              <div className="flex items-center gap-1.5">
                <button onClick={() => { const n = !dark; setDark(n); try { localStorage.setItem("dark", n?"1":"0"); } catch {} }}
                  className={cx("w-7 h-7 flex items-center justify-center rounded-md text-base transition-colors",
                    dark ? "bg-gray-700 hover:bg-gray-600" : "bg-slate-100 hover:bg-slate-200")}>
                  {dark ? "☀️" : "🌙"}
                </button>
                <button onClick={toggleTestMode}
                  className={cx("text-xs px-2 py-1 rounded border font-medium transition-colors",
                    testMode ? "bg-amber-500 text-white border-amber-500"
                             : dark ? "border-gray-600 text-gray-400 hover:bg-gray-700"
                             : "border-slate-200 text-slate-500 hover:bg-slate-50")}>
                  {testMode ? "Test data" : "Test"}
                </button>
                <button onClick={onChangeSubs}
                  className={cx("text-xs px-2 py-1 rounded border font-medium transition-colors",
                    dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
                  Subs
                </button>
                <button onClick={onSignOut}
                  className={cx("text-xs px-2 py-1 rounded font-medium transition-colors",
                    dark ? "text-gray-500 hover:bg-gray-700" : "text-slate-400 hover:bg-slate-100")}>
                  Out
                </button>
              </div>
            </div>

            {/* Filter bar — Home tab only */}
            {activeTab === "home" && (
              <div className={cx("border-t px-4 py-2 space-y-2", filBg)}>
                <div className="flex items-center gap-2">
                  <div className={cx("flex gap-0.5 rounded-md p-0.5 border flex-shrink-0", segBg)}>
                    {[7, 30, 90].map(n => (
                      <button key={n} onClick={() => setDays(n)}
                        className={cx("px-2.5 py-1 text-xs font-semibold rounded transition-colors", days === n ? segAct : segIn)}>
                        {n}d
                      </button>
                    ))}
                  </div>
                  <div className="flex-1" />
                  {data && (
                    <span className={cx("text-xs flex-shrink-0 hidden sm:block", textMuted)}>
                      {data.isTest ? "Test" : data.fromCache ? `${cacheAge}m ago` : "Fresh"} · {data.records.length.toLocaleString()}
                    </span>
                  )}
                  {/* Currency badge */}
                  {data && (
                    <span className={cx("text-xs px-1.5 py-0.5 rounded font-mono font-medium flex-shrink-0",
                      dark ? "bg-gray-700 text-gray-400" : "bg-slate-100 text-slate-500")}>
                      {data.currency}
                    </span>
                  )}
                  <button onClick={() => load(true)} disabled={loading}
                    className={cx("text-xs px-2 py-1 rounded border font-medium flex items-center gap-1 transition-colors",
                      dark ? "border-gray-600 text-gray-400 hover:bg-gray-700" : "border-slate-200 text-slate-600 hover:bg-slate-50")}>
                    {loading ? <Spinner size={11} /> : "↻"}
                  </button>
                </div>
                <div className={cx("flex gap-0.5 rounded-md p-0.5 border w-full", segBg)}>
                  {GROUP_OPTS.map(o => (
                    <button key={o.id} onClick={() => setGroupId(o.id)}
                      className={cx("flex-1 py-1 text-xs font-semibold rounded transition-colors text-center",
                        groupId === o.id ? grpAct : grpIn)}>
                      {o.label}
                    </button>
                  ))}
                </div>
              </div>
            )}
          </div>

          {/* ── Page content ──────────────────────────────────────────────────── */}
          <div className="max-w-5xl mx-auto px-4 py-4 pb-24 space-y-4">

            {/* ── ALERTS TAB (insight cards) ──────────────────────────────── */}
            {activeTab === "alerts" && (
              <div className="space-y-4">
                {!data && (
                  <div className={cx("rounded-xl border p-8 text-center text-sm",
                    dark ? "bg-gray-800 border-gray-700 text-gray-500" : "bg-white border-slate-200 text-slate-400")}>
                    Load data first to see alerts.
                  </div>
                )}
                {data && alerts.length === 0 && (
                  <div className={cx("rounded-xl border p-8 text-center",
                    dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
                    <div className="text-3xl mb-2">✅</div>
                    <h3 className={cx("font-semibold", dark ? "text-gray-200" : "text-slate-700")}>No alerts</h3>
                    <p className={cx("text-sm mt-1", dark ? "text-gray-500" : "text-slate-500")}>All resources within expected cost ranges.</p>
                  </div>
                )}
                {data && alerts.length > 0 && <InsightCards alerts={alerts} dark={dark} />}
              </div>
            )}

            {/* ── SETTINGS TAB (thresholds) ───────────────────────────────────── */}
            {activeTab === "settings" && (
              <AlertsTab records={data?.records || []} currency={data?.currency || "USD"}
                onResetBudgets={() => { if (data) { initializeResourceBudgets(data.records, true); bumpThresholds(); }}}
                onThresholdSaved={bumpThresholds} />
            )}

            {/* ── HOME TAB ───────────────────────────────────────────────────── */}
            {activeTab === "home" && (
              <>
                <ErrMsg msg={error} />

                {loading && (
                  <div className={cx("rounded-xl border shadow-sm p-10 flex flex-col items-center gap-3",
                    dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
                    <Spinner size={28} className="text-blue-400" />
                    <div className={cx("text-sm font-medium", dark ? "text-gray-300" : "text-slate-600")}>{progress}</div>
                    <div className={cx("text-xs text-center max-w-xs", textMuted)}>
                      First load may take 15–30s for PAYG subscriptions.
                    </div>
                  </div>
                )}

                {!loading && data && data.records.length === 0 && (
                  <div className={cx("rounded-xl border shadow-sm p-8 text-center",
                    dark ? "bg-gray-800 border-gray-700" : "bg-white border-slate-200")}>
                    <div className="text-3xl mb-2">🔍</div>
                    <h3 className={cx("font-semibold", dark ? "text-gray-200" : "text-slate-700")}>No cost data found</h3>
                    <p className={cx("text-sm mt-1", textMuted)}>Try a wider range or switch to test data.</p>
                  </div>
                )}

                {!loading && data && data.records.length > 0 && stats && (
                  <>
                    {/* KPI row — compact, currency shown once in header */}
                    <div className="grid grid-cols-4 gap-1.5">
                      <KpiCard label={`${days}d total`} value={fmtKpi(stats.total, data.currency)} />
                      <KpiCard label="Avg/day" value={fmtKpi(stats.avgDaily, data.currency)} />
                      <KpiCard label="Peak day" value={fmtKpi(stats.peakDay.cost, data.currency)} />
                      <KpiCard label="Forecast"
                        value={forecast ? fmtKpi(forecast.projected, data.currency) : "—"}
                        trend={forecast && forecast.mtd > 0
                          ? ((forecast.projected - forecast.mtd / Math.max(forecast.daysInMonth - forecast.daysLeft, 1) * forecast.daysInMonth)
                             / (forecast.mtd / Math.max(forecast.daysInMonth - forecast.daysLeft, 1) * forecast.daysInMonth)) * 100
                          : null}
                      />
                    </div>

                    {/* Budget progress bar */}
                    {forecast && (
                      <BudgetBar
                        mtd={forecast.mtd}
                        projected={forecast.projected}
                        budget={totalBudget}
                        currency={data.currency}
                        dark={dark}
                        onSetBudget={() => setActiveTab("alerts")}
                      />
                    )}

                    {/* Charts */}
                    <TimeSeriesChart
                      records={data.records} currency={data.currency}
                      from={data.from} to={data.to} days={days}
                      groupOpt={groupOpt} bucket={bucket} setBucket={setBucket}
                      style={style} setStyle={setStyle}
                      forecast={forecast}
                      alerts={alerts}
                      budget={totalBudget}
                    />
                    <MoversCard records={data.records} days={days} currency={data.currency} groupOpt={groupOpt} />
                    <GroupChart records={data.records} currency={data.currency} groupOpt={groupOpt} />
                    <DetailTable records={data.records} currency={data.currency} total={stats.total} groupOpt={groupOpt} />
                  </>
                )}
              </>
            )}
          </div>
          {/* ── Bottom tab bar — 3 tabs ──────────────────────────────────────── */}
          <div className={cx(
            "fixed bottom-0 left-0 right-0 z-30 border-t",
            dark ? "bg-gray-900 border-gray-700" : "bg-white border-slate-200"
          )} style={{ paddingBottom: "env(safe-area-inset-bottom, 0px)" }}>
            <div className="max-w-5xl mx-auto flex">
              {[
                {
                  id: "home", label: "Dashboard", badge: 0,
                  icon: (on) => (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                      stroke={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")}
                      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/>
                      <rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                  )
                },
                {
                  id: "alerts", label: "Alerts",
                  badge: alerts.filter(a => a.tier === "critical" || a.tier === "warning").length,
                  icon: (on) => (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                      stroke={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")}
                      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                      <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
                    </svg>
                  )
                },
                {
                  id: "settings", label: "Settings", badge: 0,
                  icon: (on) => (
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                      stroke={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")}
                      strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                      <line x1="4" y1="6" x2="20" y2="6"/>
                      <line x1="4" y1="12" x2="20" y2="12"/>
                      <line x1="4" y1="18" x2="20" y2="18"/>
                      <circle cx="14" cy="6" r="2" fill={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")} stroke="none"/>
                      <circle cx="8" cy="12" r="2" fill={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")} stroke="none"/>
                      <circle cx="16" cy="18" r="2" fill={on ? "#3b82f6" : (dark ? "#6b7280" : "#94a3b8")} stroke="none"/>
                    </svg>
                  )
                }
              ].map(tab => {
                const active = activeTab === tab.id;
                return (
                  <button key={tab.id} onClick={() => setActiveTab(tab.id)}
                    className="flex-1 flex flex-col items-center justify-center py-2.5 gap-0.5 relative transition-colors">
                    <div className="relative">
                      {tab.icon(active)}
                      {tab.badge > 0 && (
                        <span className="absolute -top-1 -right-1 min-w-[16px] h-4 flex items-center justify-center rounded-full bg-red-500 text-white text-xs font-bold px-0.5 leading-none">
                          {tab.badge}
                        </span>
                      )}
                    </div>
                    <span className={cx("text-xs font-medium transition-colors",
                      active ? "text-blue-500" : (dark ? "text-gray-500" : "text-slate-400"))}>
                      {tab.label}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
        </div>
        </DarkCtx.Provider>
      );
    }

    // =========================================================================
    // Root App
    // =========================================================================
    function App() {
      const [phase, setPhase]         = useState("init");
      const [subs, setSubs]           = useState([]);
      const [selected, setSelected]   = useState(new Set());
      const [busy, setBusy]           = useState(false);
      const [error, setError]         = useState(null);
      const [subsLoading, setSubsLoading] = useState(false);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const code = params.get("code");
        const err  = params.get("error");

        if (err) {
          window.history.replaceState({}, "", window.location.pathname);
          setError(params.get("error_description") || err);
          setPhase("signin");
          return;
        }

        if (code) {
          window.history.replaceState({}, "", window.location.pathname);
          const verifier = sessionStorage.getItem("pkce_verifier");
          sessionStorage.removeItem("pkce_verifier");
          if (!verifier) {
            setError("Missing PKCE verifier — please try signing in again.");
            setPhase("signin");
            return;
          }
          setBusy(true);
          exchangeCode(code, verifier)
            .then(async resp => {
              kv.set("auth:token", makeToken(resp, null));
              await hydrate();
            })
            .catch(e => { setError(e.message); setPhase("signin"); })
            .finally(() => setBusy(false));
          return;
        }

        hydrate();
      }, []);

      async function hydrate() {
        try {
          const raw = kv.get("auth:token");
          if (!raw) { setPhase("signin"); return; }
          let t = JSON.parse(raw);
          if (t.expires_at <= Date.now() + 60_000) {
            if (!t.refresh_token) { setPhase("signin"); return; }
            const fresh = await doRefresh(t.refresh_token);
            t = makeToken(fresh, t.refresh_token);
            kv.set("auth:token", t);
          }
          setSubsLoading(true);
          const list = await listSubs(t.access_token);
          setSubs(list);
          const selRaw = kv.get("subs:selected");
          if (selRaw) {
            const ids = JSON.parse(selRaw);
            const valid = new Set(ids.filter(id => list.some(s => s.id === id)));
            if (valid.size > 0) {
              setSelected(valid);
              setPhase("dashboard");
              return;
            }
          }
          setPhase("subs");
        } catch (e) {
          console.error(e);
          setPhase("signin");
        } finally {
          setSubsLoading(false);
        }
      }

      const signIn = useCallback(async () => {
        setError(null); setBusy(true);
        try {
          const { verifier, challenge } = await makePkce();
          const state = b64url(randBytes(16).buffer);
          sessionStorage.setItem("pkce_verifier", verifier);
          sessionStorage.setItem("pkce_state", state);
          window.location.href = buildAuthUrl(challenge, state);
        } catch (e) { setError(e.message); setBusy(false); }
      }, []);

      const signOut = useCallback(() => {
        kv.del("auth:token"); kv.del("subs:selected");
        try {
          for (let i = localStorage.length - 1; i >= 0; i--) {
            const k = localStorage.key(i);
            if (k && k.startsWith("cost:")) localStorage.removeItem(k);
          }
        } catch {}
        setSubs([]); setSelected(new Set()); setError(null);
        setPhase("signin");
      }, []);

      const toggleSub = id => setSelected(p => {
        const n = new Set(p); n.has(id) ? n.delete(id) : n.add(id); return n;
      });
      const selectAll = () => setSelected(
        selected.size === subs.length ? new Set() : new Set(subs.map(s => s.id))
      );
      const goToDashboard = () => {
        kv.set("subs:selected", JSON.stringify([...selected]));
        setPhase("dashboard");
      };

      if (phase === "init" || busy) return (
        <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center gap-3">
          <Spinner size={32} className="text-blue-400" />
          <p className="text-sm text-slate-400">{busy ? "Completing sign-in…" : "Loading…"}</p>
        </div>
      );

      if (phase === "signin") return <SignInScreen onSignIn={signIn} busy={busy} error={error} />;

      if (phase === "subs") return (
        <SubPicker subs={subs} selected={selected} onToggle={toggleSub}
          onSelectAll={selectAll} onContinue={goToDashboard}
          onSignOut={signOut} loading={subsLoading} />
      );

      if (phase === "dashboard") return (
        <Dashboard selected={selected} allSubs={subs}
          onChangeSubs={() => setPhase("subs")} onSignOut={signOut} />
      );

      return null;
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
